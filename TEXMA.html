/* ============================================================
   TRATAMIENTOS · galería de progreso   (v1.5)
   ------------------------------------------------------------
   Acné, ortodoncia, dermatología, kinesiología: cosas que duran MESES o
   AÑOS y se siguen con fotos. Por eso acá las fotos NO van al estado.

   · En el celular (APK / Capacitor) cada foto se escribe como archivo real
     con @capacitor/filesystem en Directory.Data, adentro de `texma/trat`.
     En S.treatments queda SOLO {path, uri}: cuatro renglones de texto.
     Así el localStorage —que tiene ~5 MB y ya carga las fotos de costura,
     las metas y el perfil— ni se entera de que existe este módulo.
   · En el navegador (probar en la compu, o la PWA) no hay disco propio de la
     app: ahí, y SOLO ahí, cae en la foto embebida y se avisa en pantalla.

   Contra: la copia de seguridad (Exportar) es un JSON y se lleva las rutas,
   no los archivos. Está dicho en la vista con todas las letras.
============================================================ */
const TRAT_DIR='texma/trat';
const TRAT_KINDS=['Piel / acné','Ortodoncia','Dermatología','Pelo','Kinesiología','Otro'];
/* el plugin solo existe adentro del APK; en el navegador esto da null */
function tratFS(){ return NATIVO?plug('Filesystem'):null; }
const tratNativo=()=>!!tratFS();

/* guarda la foto y devuelve lo MÍNIMO que hay que recordar de ella */
async function tratGuardarFoto(dataURL){
  const FS=tratFS();
  if(!FS) return {data:dataURL};              /* navegador: no hay dónde escribir */
  const b64=String(dataURL).split(',')[1]||'';
  if(!b64) throw new Error('La foto llegó vacía al guardarse');
  const path=`${TRAT_DIR}/${uid()}.jpg`;
  await FS.writeFile({path,data:b64,directory:'DATA',recursive:true});
  let uri='';
  try{ uri=(await FS.getUri({path,directory:'DATA'})).uri||''; }catch(e){}
  /* sin uri el <img> no tiene de dónde agarrarse: mejor fallar acá y
     avisar, que dejar una tarjeta con una foto rota para siempre */
  if(!uri){
    try{ await FS.deleteFile({path,directory:'DATA'}); }catch(e){}
    throw new Error('Guardé la foto pero Android no me dio su ruta');
  }
  return {path,uri};
}
/* de la ruta guardada al src que entiende el <img> de la WebView */
function tratSrc(p){
  if(!p) return '';
  if(p.data) return p.data;
  if(p.uri) return (window.Capacitor&&window.Capacitor.convertFileSrc)
    ? window.Capacitor.convertFileSrc(p.uri) : p.uri;
  return '';
}
async function tratBorrarFoto(p){
  const FS=tratFS();
  if(!FS||!p||!p.path) return;
  try{ await FS.deleteFile({path:p.path,directory:'DATA'}); }catch(e){}
}
const tratFotos=t=>[...(t.photos||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
function tratDias(t){
  if(!t.start) return 0;
  return Math.max(0,Math.round((pDate(hoyISO())-pDate(t.start))/864e5));
}
const TRAT_VACIO='<svg viewBox="0 0 24 24"><path d="M3.5 8.5h3.2l1.4-2.2h7.8l1.4 2.2h3.2v11h-17Z"/><circle cx="12" cy="14" r="3.4"/></svg>';

            : 'Estás en el navegador, así que las fotos quedan en la memoria de TEXMA y ocupan lugar. Instalada como app en el celular se guardan como archivos aparte y podés sumar todas las que quieras.'}

function tratPreguntarEliminar(t){

/* ---- el timeline de un tratamiento ---- */
function tratSheet(id){
  const t=S.treatments.find(x=>x.id===id); if(!t) return;
  const fotos=tratFotos(t);           /* de la más vieja a la más nueva: así se ve el progreso */
  /* agrupadas por mes, que es como se mira un tratamiento largo */
  const meses=[];
  fotos.forEach(p=>{
    const mk=(p.date||'').slice(0,7);
    let g=meses.find(x=>x.mk===mk);
    if(!g){ g={mk,fotos:[]}; meses.push(g); }
    g.fotos.push(p);
  });
  const dias=tratDias(t);
  const b=sheet(t.name,`
    <div class="card vc" style="margin-top:0">
      <div class="item" style="border-bottom:none;padding:0">
        <div class="grow"><div class="t">${t.kind?esc(t.kind):'Tratamiento'}</div>
          <div class="s">${t.start?`Empezaste el ${fLong(t.start)} · día ${dias+1}`:'Sin fecha de inicio'}</div></div>
        <span class="racha">${fotos.length} foto${fotos.length===1?'':'s'}</span>
      </div>
      ${t.note?`<div class="s" style="margin-top:10px">${esc(t.note)}</div>`:''}
    </div>
    <div class="btnrow">
      <button class="btn" id="tEd">Editar</button>
      <button class="btn primary" id="tAdd">📷 Sumar foto</button>
    </div>
    ${fotos.length?meses.map(g=>{
      const d=pDate(g.mk+'-01');
      return `<div class="tsem">${MES[d.getMonth()]} ${d.getFullYear()}</div>
        <div class="tgal">${g.fotos.map((p,i)=>{
          const n=fotos.indexOf(p);
          return `<figure data-tph="${p.id}">
            <img src="${tratSrc(p)}" alt="" loading="lazy">
            ${n===0?'<span class="tbad">ANTES</span>':(n===fotos.length-1&&fotos.length>1?'<span class="tbad">HOY</span>':'')}
            <figcaption>${fShort(p.date)}${t.start?` · d${Math.max(0,Math.round((pDate(p.date)-pDate(t.start))/864e5))+1}`:''}</figcaption>
          </figure>`;
        }).join('')}</div>`;
    }).join(''):`<div class="card vc" style="margin-top:14px"><div class="empty">
      Sacá la primera foto: esa es la del «antes» ♥</div></div>`}`);
  b.querySelector('#tEd').addEventListener('click',()=>tratForm(t));
  b.querySelector('#tAdd').addEventListener('click',()=>tratFotoNueva(t.id));
  b.querySelectorAll('[data-tph]').forEach(f=>f.addEventListener('click',()=>tratFotoSheet(t.id,f.dataset.tph)));
}

/* ---- sumar una foto ---- */
function tratFotoNueva(id){
  const t=S.treatments.find(x=>x.id===id); if(!t) return;
  /* 1400 px: es una foto de seguimiento, tiene que mostrar detalle.
     Puede darse el lujo porque va a un archivo, no al localStorage. */
  pedirFoto(async d=>{
    let guardada;
    try{ guardada=await tratGuardarFoto(d); }
    catch(e){
      console.warn('[TEXMA] no pude guardar la foto del tratamiento:',e);
      /* el motivo real, no un «algo salió mal» */
      return toast(String(e&&e.message||e)||'No pude guardar esa foto');
    }
    t.photos.push({id:uid(),date:hoyISO(),note:'',...guardada});
    if(!save()){ /* solo puede pasar en el navegador, con la foto embebida */
      t.photos.pop();
      return toast('Memoria llena — instalá TEXMA en el celu para sumar fotos');
    }
    closeSheet(); go('trata'); toast('Foto guardada ♥');
  },tratNativo()?1400:900);
}

/* ---- una foto: verla, cambiarle la fecha, borrarla ---- */
function tratFotoSheet(id,pid){

/* ---------- CICLO MENSTRUAL ---------- */
function cycleStats(){
  const ps=[...S.periods].sort((a,b)=>a.start.localeCompare(b.start));
  const cfg=S.settings.cycle||{avgCycle:28,avgPeriod:5};
  let avgC=+cfg.avgCycle||28, avgP=+cfg.avgPeriod||5;
  if(ps.length>=2){
    const gaps=[];
    for(let i=1;i<ps.length;i++) gaps.push(Math.round((pDate(ps[i].start)-pDate(ps[i-1].start))/864e5));
    const ok=gaps.filter(g=>g>=18&&g<=60);
    if(ok.length) avgC=Math.round(ok.reduce((a,b)=>a+b,0)/ok.length);
  }
  const dur=ps.filter(p=>p.end).map(p=>Math.round((pDate(p.end)-pDate(p.start))/864e5)+1).filter(d=>d>0&&d<15);
  if(dur.length) avgP=Math.round(dur.reduce((a,b)=>a+b,0)/dur.length);
  /* el ciclo actual arranca en el último período ya empezado */
  const pasados=ps.filter(p=>p.start<=hoyISO());
  const last=pasados[pasados.length-1]||ps[ps.length-1]||null;
  const activo=!!last&&!last.end&&last.start<=hoyISO();
  let dia=0,next='',ovu='',falta=0;
  if(last){
    dia=Math.max(1,Math.round((pDate(hoyISO())-pDate(last.start))/864e5)+1);
    const nd=pDate(last.start); nd.setDate(nd.getDate()+avgC); next=iso(nd);
    const od=pDate(next); od.setDate(od.getDate()-14); ovu=iso(od);
    falta=Math.round((pDate(next)-pDate(hoyISO()))/864e5);
  }
  return {ps,avgC,avgP,last,activo,dia,next,ovu,falta,gaps:ps.length};
}
function dayKind(ds,st){
  /* real: días marcados como período */
  for(const p of st.ps){
    const end=p.end||(p===st.last&&!p.end?hoyISO():p.start);
    if(ds>=p.start&&ds<=end) return 'per';
  }
  if(!st.last) return '';
  /* predicción a futuro */
  if(ds>hoyISO()){
    let s=pDate(st.last.start);
    for(let i=0;i<14;i++){
      s.setDate(s.getDate()+st.avgC);
      const ss=iso(s), e=pDate(ss); e.setDate(e.getDate()+st.avgP-1);
      if(ds>=ss&&ds<=iso(e)) return 'per pred';
      const ov=pDate(ss); ov.setDate(ov.getDate()-14);
      if(ds===iso(ov)) return 'ovu';
      const f1=pDate(ss); f1.setDate(f1.getDate()-19);
      const f2=pDate(ss); f2.setDate(f2.getDate()-13);
      if(ds>=iso(f1)&&ds<=iso(f2)) return 'fer';
      if(ss>ds) break;
    }
  }
  return '';
}

/* ============================================================
   MERCERÍA Y STOCK
   ------------------------------------------------------------
   Modelo · S.stock[]:
     { id, fotos:[≤2 base64], titulo, categoria, subcategoria,
       cantidad, unidad:'mts'|'u'|'pack', costo_unitario, precio_venta,
       alerta_stock }
   alerta_stock es el umbral: con cantidad ≤ alerta_stock la tarjeta
   se marca en rojo y el producto entra en el filtro «A reponer».
   Las copias viejas se traducen solas en la carga (stockNorm).
============================================================ */
const STOCKCATS=['Cinta al bies','Cierres','Deslizadores','Botones','Elásticos','Hilos','Puntillas','Broches','Telas','Otro'];
const STOCK_UNI=[['mts','Metros'],['u','Unidad'],['pack','Pack']];
/* OJO: stockNorm corre en la carga del estado, antes de que existan las
   const de acá arriba. Por eso no usa ninguna: solo literales. */
function stockNorm(i){
  const n=v=>{ const x=parseFloat(v); return isFinite(x)?x:0; };
  const u=String(i.unidad??i.unit??'u').trim().toLowerCase();
  const unidad=/^(m|mt|mts|metro|metros)$/.test(u)?'mts'
    :/^(pack|packs|paq|paquete|paquetes)$/.test(u)?'pack'
    :(!u||/^(u|un|uds?|unidad|unidades)$/.test(u))?'u':u;   /* otra unidad vieja (kg…) se respeta */
  return {
    id:i.id||uid(),
    fotos:(Array.isArray(i.fotos)?i.fotos:[]).filter(f=>typeof f==='string'&&f).slice(0,2),
    titulo:String(i.titulo??i.name??'').trim()||'Sin nombre',
    categoria:String(i.categoria??i.cat??'Otro').trim()||'Otro',
    subcategoria:String(i.subcategoria??'').trim(),
    cantidad:n(i.cantidad??i.qty),
    unidad,
    costo_unitario:n(i.costo_unitario??i.cost),
    precio_venta:n(i.precio_venta??i.price),
    alerta_stock:n(i.alerta_stock??i.min),
  };
}
const stockCats=()=>{
  const extra=[...(S.settings.stockCats||[]),...S.stock.map(i=>i.categoria)].filter(c=>c&&c!=='Otro');
  return [...new Set([...STOCKCATS.filter(c=>c!=='Otro'),...extra]),'Otro'];
};
const stkBajo=i=>(+i.cantidad||0)<=(+i.alerta_stock||0);
const fCant=v=>{ const x=+v||0; return x.toLocaleString('es-AR',{maximumFractionDigits:2}); };
/* «mts» · «u» · «packs» — para «Stock: 12 mts» */
function uniTxt(i){
  if(i.unidad==='pack') return (+i.cantidad===1)?'pack':'packs';
  return i.unidad||'u';
}
/* la leyenda del precio según cómo se vende */
function precioPor(u){
  return u==='mts'?'Precio por metro':u==='pack'?'Precio por pack':u==='u'?'Precio por unidad':'Precio por '+u;
}
function stockMove(it,type,qty,note,money,pu){
  qty=Math.abs(+qty||0); if(!qty) return;
  it.cantidad=Math.max(0,Math.round(((+it.cantidad||0)+(type==='out'?-qty:qty))*100)/100);
  const mv={id:uid(),itemId:it.id,type,qty,date:hoyISO(),note:note||''};
  /* v1.7 · precio unitario cobrado/pagado y costo del producto EN ESE MOMENTO:
     así la ganancia de una venta no cambia si mañana se actualiza el costo */
  if(+pu>0) mv.pu=+pu;
  mv.costo=+it.costo_unitario||0;
  S.stockMoves.unshift(mv);
  if(S.stockMoves.length>500) S.stockMoves.length=500;
  if(money&&money.amount>0){
    /* v1.7 · el movimiento y su registro en Finanzas se apuntan entre sí
       (finId ↔ moveId): así borrar el movimiento borra exactamente ESE registro */
    const fin={id:uid(),type:money.type,amount:money.amount,cat:money.cat,
      date:hoyISO(),desc:`${money.type==='in'?'Venta':'Compra'} · ${it.titulo} ×${fCant(qty)}`,stockId:it.id,moveId:mv.id};
    S.finance.push(fin);
    mv.finId=fin.id;
  }
}
/* el registro de Finanzas que generó un movimiento (o null).
   Los movimientos de antes de v1.7 no tienen el vínculo: se busca el que
   coincide en producto, fecha, tipo y «×cantidad», y que no sea de otro. */
function finDeMovimiento(m){
  if(m.finId){ return S.finance.find(f=>f.id===m.finId)||null; }
  const directo=S.finance.find(f=>f.moveId===m.id);
  if(directo) return directo;
  const tomados=new Set(S.stockMoves.map(x=>x.finId).filter(Boolean));
  const qtys=[fCant(m.qty),String(m.qty)];
  return S.finance.find(f=>f.stockId===m.itemId&&!f.moveId&&!tomados.has(f.id)&&f.date===m.date
    &&f.type===(m.type==='in'?'out':'in')&&qtys.some(q=>String(f.desc||'').endsWith('×'+q)))||null;
}
/* Eliminar un movimiento: revierte el stock, borra su registro en Finanzas
   (si lo había) y el movimiento. `despues` corre al terminar (re-dibujar). */
function borrarMovimiento(m,despues){
  const it=S.stock.find(x=>x.id===m.itemId);
  const fin=finDeMovimiento(m);
  const u=it?uniTxt({...it,cantidad:m.qty}):'';
  const antes=it?(+it.cantidad||0):0;
  const nuevo=Math.round((antes+(m.type==='in'?-m.qty:m.qty))*100)/100;
  const queda=Math.max(0,nuevo);
  const partes=[
    /* dlg() ya escapa el mensaje: acá va texto plano */
    `Se deshace ${m.type==='in'?'la entrada':'la salida'} de ${fCant(m.qty)} ${u} del ${fShort(m.date)}.`,
    it?`Stock de «${it.titulo}»: ${fCant(antes)} → ${fCant(queda)} ${uniTxt({...it,cantidad:queda})}.`:'',
    nuevo<0?'(Ya no quedaba tanto: el stock queda en 0.)':'',
    fin?`También se borra ${fin.type==='in'?'el ingreso':'el gasto'} de ${fMoney(fin.amount)} en Finanzas.`:'',
  ].filter(Boolean);
  dlg({title:'¿Eliminar este movimiento?',msg:partes.join(' '),okTxt:'Eliminar',danger:true},ok=>{
    if(!ok) return;
    if(it) it.cantidad=queda;
    if(fin) S.finance=S.finance.filter(f=>f.id!==fin.id);
    S.stockMoves=S.stockMoves.filter(x=>x.id!==m.id);
    save();
    if(despues) despues(); else go(cur);
    toast('Movimiento eliminado · stock corregido');
  });
}
/* ============================================================
   MERCERÍA · BALANCE DE VENTAS
   ------------------------------------------------------------
   Venta = movimiento de salida que no sea un «ajuste rápido» (el −
   de la tarjeta, que es para corregir conteos, no para vender).
   Plata de una venta: lo que quedó en Finanzas (lo real); si no se
   registró en Finanzas pero se cargó el precio, ese precio × cantidad.
   Ganancia: plata − cantidad × costo del momento (mv.costo). Los
   movimientos de antes de v1.7 no guardan el costo: se usa el costo
   actual del producto y el panel lo marca como «estimada».
============================================================ */
const esAjuste=m=>m.note==='ajuste rápido';
const esVenta=m=>m.type==='out'&&!esAjuste(m);
function movPlata(m){
  const f=finDeMovimiento(m);
  if(f) return +f.amount||0;
  return m.pu?Math.round(m.pu*m.qty*100)/100:0;
}
function movCosto(m){
  if(m.costo!==undefined) return {c:(+m.costo||0)*m.qty,est:false};
  const it=S.stock.find(x=>x.id===m.itemId);
  return {c:(+(it&&it.costo_unitario)||0)*m.qty,est:true};
}
/* período: 'mes' · 'prev' · 'anio' · 'todo' · 'm:YYYY-MM' */
function stkPeriodo(per){
  const d=new Date(), ym=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
  const mesTxt=k=>{ const [y,mm]=k.split('-'); return `${MES[+mm-1]} ${y}`; };
  if(per==='todo') return {ok:()=>true,txt:'Histórico'};
  if(per==='anio'){ const y=String(d.getFullYear()); return {ok:ds=>ds.startsWith(y),txt:'Año '+y}; }
  if(per==='prev'){ const p=new Date(d.getFullYear(),d.getMonth()-1,1), k=ym(p); return {ok:ds=>ds.startsWith(k),txt:mesTxt(k)}; }
  if(per&&per.startsWith('m:')){ const k=per.slice(2); return {ok:ds=>ds.startsWith(k),txt:mesTxt(k)}; }
  const k=ym(d); return {ok:ds=>ds.startsWith(k),txt:mesTxt(k)};
}
function stkBalance(per){
  const P=stkPeriodo(per);
  const movs=S.stockMoves.filter(m=>P.ok(m.date||''));
  const ventas=movs.filter(esVenta);
  let plata=0,costo=0,est=false,sinPrecio=0;
  const porUni={};
  ventas.forEach(m=>{
    const pl=movPlata(m); plata+=pl;
    if(!pl) sinPrecio++;
    else{ const c=movCosto(m); costo+=c.c; if(c.est) est=true; }
    const it=S.stock.find(x=>x.id===m.itemId), u=(it&&it.unidad)||'u';
    porUni[u]=(porUni[u]||0)+m.qty;
  });
  const compras=movs.filter(m=>m.type==='in').reduce((t,m)=>{ const f=finDeMovimiento(m); return t+(f?+f.amount||0:(m.pu?m.pu*m.qty:0)); },0);
  const vendidos=Object.entries(porUni).map(([u,q])=>`${fCant(q)} ${u==='pack'?(q===1?'pack':'packs'):u}`).join(' · ')||'0';
  return {P,movs,ventas,plata,gan:plata-costo,est,sinPrecio,compras,vendidos};
}
/* fila de un movimiento (tocable para eliminar) */
function movRow(m,conNombre){
  const i=S.stock.find(x=>x.id===m.itemId);
  const u=i?esc(i.unidad):'';
  const plata=movPlata(m);
  const tipo=esAjuste(m)?'Ajuste':m.type==='in'?'Entrada':'Venta';
  /* «2 × $ 650» si se sabe el precio unitario */
  const pu=plata?plata/m.qty:0;
  const det=plata?`${fCant(m.qty)} × ${fMoney(pu)}`:(esVenta(m)?'sin precio registrado':'');
  const gan=esVenta(m)&&plata?plata-movCosto(m).c:null;
  return `<div class="item mvrow" data-mv="${m.id}" role="button" aria-label="Eliminar movimiento">
    <div class="grow">
      ${conNombre?`<div class="t" style="font-weight:600">${esc(i?i.titulo:'—')}</div>`:''}
      <div class="s">${tipo} · ${fShort(m.date)}${det?' · '+det:''}${m.note&&!esAjuste(m)?' · '+esc(m.note):''}</div>
      ${gan!==null?`<div class="s mvg ${gan<0?'neg':''}">ganancia ${fMoney(gan)}</div>`:''}
    </div>
    <div class="mvr">
      ${plata?`<b class="mono mvp ${m.type}">${m.type==='out'?'+':'−'}${fMoney(plata)}</b>`:''}
      <span class="mono mvq ${m.type}">${m.type==='in'?'+':'−'}${fCant(m.qty)} ${u}</span>
    </div>
    <span class="mvx" aria-hidden="true">✕</span>
  </div>`;
}

/* Eliminar un producto de mercería, con confirmación. Se lleva su historial
   de movimientos; lo que ya se anotó en Finanzas (compras/ventas) queda,
   porque esa plata se movió de verdad. */
function borrarProducto(it){
  dlg({title:'¿Eliminar producto?',
       msg:`«${it.titulo}» se borra junto con su historial de movimientos. No se puede deshacer.`,
       okTxt:'Eliminar',danger:true},ok=>{
    if(!ok) return;
    S.stock=S.stock.filter(x=>x.id!==it.id);
    S.stockMoves=S.stockMoves.filter(m=>m.itemId!==it.id);
    save(); closeSheet(); go(cur); toast('Producto eliminado');
  });
}
let stkQ='', stkCat='';          /* búsqueda y chip elegido: sobreviven a los re-dibujos */
let stkPer='mes';                /* período del balance de ventas */
/* ---------- los botones rápidos − / ＋ de cada tarjeta ----------
   ＋ = compré 1 → entrada de stock + GASTO en Finanzas (costo_unitario × 1)
   − = vendí 1   → salida de stock + INGRESO en Finanzas (precio_venta × 1)
   Quedan vinculados igual que los del formulario «Entrada / venta»: suman
   al balance del período al instante y se pueden eliminar y revertir.
   Si el producto no tiene costo/precio cargado, el stock se mueve igual
   pero sin plata (y se avisa, para que lo cargue en Editar). */
function stockRapido(it,type){
  const qty=1;
  const pu=type==='in'?(+it.costo_unitario||0):(+it.precio_venta||0);
  const money=pu>0?{type:type==='in'?'out':'in',amount:Math.round(pu*qty*100)/100,cat:type==='in'?'Telas':'Ventas'}:null;
  stockMove(it,type,qty,type==='in'?'compra rápida':'venta rápida',money,pu);
  save(); VIEWS.stock.render();
  const u=uniTxt({...it,cantidad:qty});
  if(!money) toast(`${type==='in'?'+1':'−1'} ${u} · sin ${type==='in'?'costo':'precio'} cargado: no suma plata (cargalo en Editar)`);
  else toast(type==='in'?`Compra · +1 ${u} · −${fMoney(money.amount)}`:`Venta · −1 ${u} · +${fMoney(money.amount)}`);
}

      }).join(''):`<div class="card" style="grid-column:1/-1"><div class="empty">${
        S.stock.length?'Nada con ese filtro':'Cargá tu primer producto con el + de abajo'}</div></div>`;
    };
    paint();
    const sq=V.querySelector('#sq');
    sq.addEventListener('input',()=>{ stkQ=sq.value; paint(); });
    sChips.addEventListener('click',e=>{
      const c=e.target.closest('[data-sc]'); if(!c) return;
      stkCat=c.dataset.sc; paint();
    });
    V.querySelector('[data-verbajos]')?.addEventListener('click',()=>{ stkCat='__bajo'; paint(); });
    sGrid.addEventListener('click',e=>{
      const bt=e.target.closest('[data-sm]');
      if(bt){
        const [id,op]=bt.dataset.sm.split('|');
        const i=S.stock.find(x=>x.id===id); if(!i) return;
        if(op==='-'&&(+i.cantidad||0)<=0) return toast('No queda stock para vender');
        stockRapido(i,op==='-'?'out':'in');

      }
      const c=e.target.closest('[data-stk]'); if(!c) return;
      const i=S.stock.find(x=>x.id===c.dataset.stk); if(i) stockSheet(i);
    });
  }
};

/* ============================================================
   NOTIFICACIONES LOCALES
   · Se muestran por el service worker (aguantan mejor en Android).
   · Si el navegador soporta TimestampTrigger, se programan de verdad
     y suenan aunque la app esté cerrada.
   · Si no, se revisan mientras la app vive + "puesta al día" al abrirla.
============================================================ */
let swReg=null;
const HAS_TRIGGER=('Notification' in window)&&('showTrigger' in Notification.prototype);

/* ============================================================
   MODO APP INSTALADA (Capacitor / APK de Android)
   ------------------------------------------------------------
   Adentro del APK los avisos NO son del navegador: son alarmas
   del sistema Android. Eso significa hora exacta, sin internet,
   con la app cerrada y CON EL SONIDO PROPIO DE TEXMA.
   En la web (PWA) nada de esto existe y sigue el camino de siempre.
============================================================ */
const NATIVO=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
/* v1.2.2: el canal pasa a -2 a propósito. Android CONGELA el sonido del
   canal cuando se crea, y los celulares que instalaron el APK anterior
   armaron 'texma-avisos' cuando el mp3 todavía no estaba en res/raw:
   ahí el aviso queda mudo para siempre. Con un id nuevo, canal nuevo. */
const CANAL='texma-avisos-2';
/* ============================================================
   CANAL DE ALARMA
   ------------------------------------------------------------
   Los avisos normales y las ALARMAS de la agenda no pueden compartir
   canal: en Android el sonido, la vibración y la importancia se
   congelan por canal al crearlo. La alarma va en el suyo, con
   importancia máxima (5 = suena y aparece encima de todo) y el mp3
   largo. Si algún día cambia el sonido, hay que subir el número del
   id (texma-alarma-2) o los celulares que ya la tienen siguen con
   el viejo.
   «Insistente» se logra a mano: la misma alarma se programa REPES
   veces, una por minuto, y las acciones Apagar / Posponer cancelan
   las que faltan. Capacitor no expone el loop nativo del sonido.
============================================================ */
const CANAL_AL='texma-alarma-1';
const ALARMA_SND='alarma_texma.wav';
const AL_REPES=5, AL_GAP=60000, AL_SNOOZE=10;
const plug=n=>(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n])||null;
let permNativo=false;

/* Android exige que el id del aviso sea un número; se deriva de la clave */
function idNum(k){
  let h=2166136261;
  for(let i=0;i<k.length;i++){ h^=k.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0)%2000000000+1;
}

async function nativoIniciar(){
  if(!NATIVO) return;
  const LN=plug('LocalNotifications'); if(!LN) return;
  try{
    /* el canal define el sonido: cambiarlo después NO tiene efecto,
       Android lo congela. Si algún día cambia el mp3, hay que cambiar
       también el id del canal (texma-avisos-2, etc.). */
    await LN.createChannel({
      id:CANAL, name:'Avisos de TEXMA',
      description:'Remedios, citas, pagos y recordatorios',
      importance:5, visibility:1, vibration:true, lights:true, lightColor:'#EC1968',
      sound:(S.settings.nSound||'texma')==='texma'?'notif_texma.mp3':undefined,
    });
    await LN.createChannel({
      id:CANAL_AL, name:'Alarmas de TEXMA',
      description:'Citas y eventos con alarma insistente',
      importance:5, visibility:1, vibration:true, lights:true, lightColor:'#EC1968',
      sound:ALARMA_SND,
    });
    /* los dos botones que le salen a la alarma en la barra de avisos */
    try{
      await LN.registerActionTypes({types:[{id:'TEXMA_ALARMA',actions:[
        {id:'apagar',title:'Apagar',destructive:true},
        {id:'posponer',title:'Posponer '+AL_SNOOZE+' min'},
      ]}]});
    }catch(e){}
    const p=await LN.checkPermissions();
    permNativo=p.display==='granted';
    /* tocar el aviso lleva a la sección que corresponde;
       si es una alarma, primero se apagan las repeticiones que faltan */
    LN.addListener('localNotificationActionPerformed',ev=>{
      const x=(ev&&ev.notification&&ev.notification.extra)||{};
      const act=(ev&&ev.actionId)||'';
      if(x.alarmKey){
        alarmaApagar(x.alarmKey);
        if(act==='posponer'){ alarmaPosponer(x,ev.notification); return; }
        if(act==='apagar') return;
      }
      const v=x.view;
      if(v&&VIEWS[v]) go(v);
    });
  }catch(e){}
  const SB=plug('StatusBar');
  if(SB){ try{ SB.setBackgroundColor({color:barraColor()}); SB.setStyle({style:sbStyle()}); }catch(e){} }
}

async function nativoPermiso(){
  const LN=plug('LocalNotifications'); if(!LN) return false;
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted') p=await LN.requestPermissions();
    permNativo=p.display==='granted';
    if(!permNativo) toast('Bloqueado — activalo en los ajustes del celu');
    return permNativo;
  }catch(e){ return false; }
}

/* apaga las repeticiones que todavía no sonaron de esa alarma */
function alarmaApagar(key){
  const LN=plug('LocalNotifications'); if(!LN||!key) return;
  const ids=[{id:idNum(key+'#snz')}];
  for(let r=0;r<AL_REPES;r++) ids.push({id:idNum(key+'#'+r)});
  try{ LN.cancel({notifications:ids}); }catch(e){}
}
function alarmaPosponer(extra,n){
  const LN=plug('LocalNotifications'); if(!LN) return;
  try{
    LN.schedule({notifications:[{
      id:idNum(extra.alarmKey+'#snz'),
      title:(n&&n.title)||'⏰ TEXMA', body:(n&&n.body)||'Recordatorio pospuesto',
      schedule:{at:new Date(Date.now()+AL_SNOOZE*60000),allowWhileIdle:true},
      channelId:CANAL_AL, smallIcon:'ic_stat_texma', iconColor:'#EC1968',
      sound:ALARMA_SND, actionTypeId:'TEXMA_ALARMA', autoCancel:true,
      extra:{...extra},
    }]});
    toast('Pospuesta '+AL_SNOOZE+' min');
  }catch(e){}
}

/* reprograma TODAS las alarmas de los próximos 7 días */
let ultProg=0;   /* cuántas alarmas quedaron cargadas (para el diagnóstico) */
async function nativoProgramar(){
  if(!NATIVO||!S.settings.notif) return;
  const LN=plug('LocalNotifications'); if(!LN) return;
  /* el permiso puede haberse concedido desde los ajustes del celu con la
     app abierta: si lo damos por perdido, no se programa nunca más nada */
  if(!permNativo){
    try{ permNativo=(await LN.checkPermissions()).display==='granted'; }catch(e){}
    if(!permNativo) return;
  }
  try{
    const pend=await LN.getPending();
    if(pend?.notifications?.length) await LN.cancel({notifications:pend.notifications});
    const conSonido=(S.settings.nSound||'texma')!=='mudo';
    const lista=[];
    for(let i=0;i<7;i++){
      const d=new Date(); d.setDate(d.getDate()+i); const ds=iso(d);
      dueList(ds).forEach(n=>{
        const [H,M]=n.time.split(':').map(Number);
        const cuando=new Date(d); cuando.setHours(H,M,0,0);
        if(cuando.getTime()<=Date.now()+30000) return;
        /* alarma: la misma cosa repetida cada minuto hasta que la apaguen */
        if(n.alarm){
          for(let r=0;r<AL_REPES;r++){
            const t=cuando.getTime()+r*AL_GAP;
            if(t<=Date.now()+3000) continue;
            lista.push({
              id:idNum(n.key+'#'+r), title:'⏰ '+n.title, body:n.body,
              schedule:{at:new Date(t),allowWhileIdle:true},
              channelId:CANAL_AL, smallIcon:'ic_stat_texma', iconColor:'#EC1968',
              sound:conSonido?ALARMA_SND:undefined,
              actionTypeId:'TEXMA_ALARMA', autoCancel:true, group:'texma-alarma',
              extra:{view:'cal',alarmKey:n.key},
            });
          }
          return;
        }
        lista.push({
          id:idNum(n.key), title:n.title, body:n.body,
          schedule:{at:cuando,allowWhileIdle:true},
          channelId:CANAL, smallIcon:'ic_stat_texma', iconColor:'#EC1968',
          sound:conSonido&&(S.settings.nSound||'texma')==='texma'?'notif_texma.mp3':undefined,
          extra:{view:n.key[0]==='m'?'meds':n.key[0]==='e'?'cal':n.key[0]==='r'?'fin':
                      n.key[0]==='g'?'gracias':n.key[0]==='t'?'entreno':'hoy'},
        });
      });
    }
    /* Android aguanta ~500 alarmas; una alarma se lleva AL_REPES lugares */
    if(lista.length) await LN.schedule({notifications:lista.slice(0,450)});
    ultProg=Math.min(lista.length,450);
  }catch(e){ ultProg=-1; console.warn('[TEXMA] no pude programar las alarmas:',e); }
}

function notifOK(){
  if(NATIVO) return permNativo&&S.settings.notif;
  return ('Notification' in window)&&Notification.permission==='granted'&&S.settings.notif;
}

/* ---------- sonido propio de TEXMA ----------
   Con la app abierta suena este archivo. Si no está subido todavía,
   se sintetiza un campanita suave para no quedar mudo.
   OJO: con la app CERRADA el sonido lo pone el celular (canal de
   notificaciones del navegador) — un sonido propio ahí solo se puede
   con la app nativa (APK). Ver server/NOTIFICACIONES.md */
const SND_URL='notif_texma.mp3';
let sndEl=null, sndRoto=false;
function playSound(){
  const modo=S.settings.nSound||'texma';
  if(modo==='mudo') return;
  if(modo==='sistema'){ try{ navigator.vibrate&&navigator.vibrate([90,50,90]); }catch(e){} return; }
  if(!sndRoto){
    try{
      if(!sndEl){ sndEl=new Audio(SND_URL); sndEl.preload='auto'; sndEl.addEventListener('error',()=>{sndRoto=true;}); }
      sndEl.currentTime=0;
      const p=sndEl.play();
      if(p&&p.catch) p.catch(()=>{ sndRoto=true; chime(); });
      return;
    }catch(e){ sndRoto=true; }
  }
  chime();
}
/* campanita sintetizada (plan B, sin archivos) */
function chime(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC(), t=ac.currentTime;
    [[880,0],[1320,.14],[1760,.26]].forEach(([f,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d);
      g.gain.linearRampToValueAtTime(.18,t+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);
      o.connect(g).connect(ac.destination); o.start(t+d); o.stop(t+d+.55);
    });
    setTimeout(()=>{ try{ ac.close(); }catch(e){} },1200);
  }catch(e){}
}

function notify(title,body,tag,when){
  if(NATIVO){
    const LN=plug('LocalNotifications');
    if(!LN) return false;
    try{
      LN.schedule({notifications:[{
        id:idNum(tag||'texma')+(when?0:1),title,body,
        schedule:{at:new Date(when||Date.now()+1200),allowWhileIdle:true},
        channelId:CANAL,smallIcon:'ic_stat_texma',iconColor:'#EC1968',
        sound:(S.settings.nSound||'texma')==='texma'?'notif_texma.mp3':undefined,
      }]});
      return true;
    }catch(e){ return false; }
  }
  const opt={body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'texma',
    renotify:true,vibrate:[90,50,90],requireInteraction:false,silent:false,data:{t:Date.now()}};
  if(!when&&!document.hidden) playSound();
  try{
    if(when&&HAS_TRIGGER&&swReg){
      swReg.showNotification(title,{...opt,showTrigger:new TimestampTrigger(when)});
      return true;
    }
    if(swReg&&swReg.showNotification) swReg.showNotification(title,opt);
    else new Notification(title,opt);
  }catch(e){
    try{ new Notification(title,{body,icon:'icon-192.png'}); }catch(e2){ return false; }
  }
  return true;
}
/* ============================================================
   RECORDATORIOS DE LA AGENDA
   ------------------------------------------------------------
   Un evento con hora puede avisar varias veces (a la hora, 10 min
   antes, 1 hora antes, 1 día antes). Cada aviso cae en SU día —
   por eso esto devuelve el \`ds\` de cada uno y no solo el del evento:
   el «1 día antes» de una cita del martes se programa el lunes.
============================================================ */
function avisosEvento(e){
  if(!e||!e.date||!e.time) return [];
  const [H,M]=e.time.split(':').map(Number);
  if(isNaN(H)||isNaN(M)) return [];
  const base=pDate(e.date); base.setHours(H,M,0,0);
  return remOf(e).map(off=>{
    const w=new Date(base.getTime()-off*60000);
    const ds=iso(w);
    const hm=`${String(w.getHours()).padStart(2,'0')}:${String(w.getMinutes()).padStart(2,'0')}`;
    return {ds,n:{
      key:`e${off}|${ds}|${e.id}`, time:hm, pre:off>0, alarm:!!e.alarm,
      title:'TEXMA · agenda',
      body:`${e.title}${e.place?' · '+e.place:''} — ${off===0?e.time:`${remTxt(off)} (${fShort(e.date)} ${e.time})`}`,
    }};
  });
}
/* todo lo que tiene que avisar un día dado */
function dueList(ds){
  const NM=S.settings.nMods||{}, out=[], dow=pDate(ds).getDay();
  if(NM.meds!==false) S.meds.forEach(m=>{
    if(!medActiveOn(m,ds)) return;   /* fuera de la ventana del tratamiento: sin alarma */
    if(m.days&&m.days.length&&!m.days.includes(dow)) return;
    (m.times||[]).forEach(t=>out.push({key:`m|${ds}|${m.id}|${t}`,time:t,
      title:'TEXMA · medicamento',body:`${m.name}${m.dose?' · '+m.dose:''} — ${t}`}));
  });
  if(NM.events!==false) S.events.forEach(e=>{
    avisosEvento(e).forEach(a=>{ if(a.ds===ds) out.push(a.n); });
  });
  if(NM.pagos!==false){
    /* pre-avisos: un aviso por día, desde N días antes (0 a 5, se elige en Ajustes) */
    const dias=Math.max(0,Math.min(5,+NM.pagosDias||0));
    S.recurring.forEach(r=>{
      if(r.nextDue===ds) out.push({key:`r0|${ds}|${r.id}`,time:'09:00',
        title:'TEXMA · pago',body:`Hoy vence ${r.name} · ${fMoney(r.amount,r.currency)}`});
      for(let i=1;i<=dias;i++){
        const d2=pDate(ds); d2.setDate(d2.getDate()+i);
        if(r.nextDue===iso(d2)) out.push({key:`r${i}|${ds}|${r.id}`,time:'09:00',pre:true,
          title:'TEXMA · pago',body:`${r.name} vence ${i===1?'mañana':`en ${i} días`} · ${fMoney(r.amount,r.currency)}`});
      }
    });
  }
  if(NM.grat&&!S.gratitude.some(x=>x.date===ds))
    out.push({key:`g|${ds}`,time:NM.gratTime||'20:00',
      title:'TEXMA · agradecimiento',body:'¿Qué agradecés hoy? Escribilo en un ratito ♥'});
  if(NM.entreno&&!trainedOn(ds))
    out.push({key:`t|${ds}`,time:NM.entrenoTime||'19:00',
      title:'TEXMA · entrenamiento',body:'No cortes la racha 🔥 anotá lo de hoy'});
  if(NM.ciclo&&S.settings.cycleOn){
    const st=cycleStats();
    if(st.next){
      const av=pDate(st.next); av.setDate(av.getDate()-2);
      if(iso(av)===ds) out.push({key:`c|${ds}`,time:'10:00',pre:true,
        title:'TEXMA · ciclo',body:`Tu período estaría por llegar el ${fShort(st.next)}`});
    }
  }
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function firedMap(today){
  if(!S.fired||S.fired.d!==today) S.fired={d:today,k:{}};
  return S.fired.k;
}
function checkNotifs(){
  if(NATIVO) return;   /* en el APK las alarmas las dispara Android */
  if(!notifOK()) return;
  const now=new Date(), today=hoyISO();
  const hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const fk=firedMap(today);
  let dirty=false;
  dueList(today).forEach(n=>{
    if(n.time>hm||fk[n.key]) return;
    fk[n.key]=1; dirty=true;
    /* puesta al día: si pasaron más de 3 horas ya no molesta, solo lo marca */
    const [H,M]=n.time.split(':').map(Number);
    const mins=(now.getHours()*60+now.getMinutes())-(H*60+M);
    if(mins<=180) notify(n.title,(mins>2?`(era ${n.time}) `:'')+n.body,n.key);
  });
  if(dirty) save();
}
/* alarmas reales programadas (solo donde el navegador lo soporta) */
async function scheduleTriggers(){
  if(NATIVO){ await nativoProgramar(); return; }
  if(!HAS_TRIGGER||!swReg||!notifOK()) return;
  try{
    const olds=await swReg.getNotifications({includeTriggered:false});
    olds.forEach(n=>{ if(n.tag&&/^[mertgc]\d*\|/.test(n.tag)) n.close(); });
  }catch(e){}
  const now=Date.now();
  for(let i=0;i<3;i++){ /* hoy y los dos días siguientes */
    const d=new Date(); d.setDate(d.getDate()+i); const ds=iso(d);
    dueList(ds).forEach(n=>{
      const [H,M]=n.time.split(':').map(Number);
      const when=new Date(d); when.setHours(H,M,0,0);
      if(when.getTime()>now+2000) notify(n.title,n.body,n.key,when.getTime());
    });
  }
}
let notifT=null;
function startNotifLoop(){
  clearInterval(notifT);
  notifT=setInterval(checkNotifs,15000);
  checkNotifs(); scheduleTriggers();
  pushSubscribe();
}

/* ============================================================
   AVISOS EN SEGUNDO PLANO (Web Push)
   ------------------------------------------------------------
   Lo de arriba (checkNotifs / TimestampTrigger) solo aguanta con la
   app viva. Para que avise SIEMPRE — con la app cerrada — hace falta
   que un servidor mande el push. Acá la app:
     1. se suscribe al navegador con la clave VAPID pública,
     2. le manda la suscripción + su agenda al backend (Supabase),
     3. el backend, con un cron cada minuto, dispara los avisos.
   Todo el backend está en server/push/ y la guía en
   server/NOTIFICACIONES.md. Mientras PUSH_ON sea false no se usa.
============================================================ */
const PUSH_ON=false;                       /* ← poné true cuando el backend esté arriba */
const PUSH_API='';                         /* ej: https://XXXX.supabase.co/functions/v1/texma-push */
const VAPID_PUB='';                        /* clave PÚBLICA VAPID (la privada vive en el servidor) */

function b64uToU8(s){
  const pad='='.repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
let pushBusy=false;
async function pushSubscribe(){
  if(!PUSH_ON||!PUSH_API||!VAPID_PUB) return null;
  if(pushBusy||!notifOK()||!swReg||!('PushManager' in window)) return null;
  pushBusy=true;
  try{
    let sub=await swReg.pushManager.getSubscription();
    if(!sub) sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(VAPID_PUB)});
    await pushSync(sub);
    return sub;
  }catch(e){ return null; }
  finally{ pushBusy=false; }
}
/* le manda al backend la suscripción y QUÉ tiene que avisar (próximos 7 días) */
async function pushSync(sub){
  if(!PUSH_ON||!PUSH_API) return;
  const s=sub||(swReg&&await swReg.pushManager.getSubscription().catch(()=>null));
  if(!s) return;
  const avisos=[];
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i); const ds=iso(d);
    dueList(ds).forEach(n=>{
      const [H,M]=n.time.split(':').map(Number);
      const w=new Date(d); w.setHours(H,M,0,0);
      if(w.getTime()>Date.now()+30000) avisos.push({key:n.key,at:w.toISOString(),title:n.title,body:n.body});
    });
  }
  try{
    await fetch(PUSH_API+'/sync',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({device:deviceId(),sub:s.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
        sound:S.settings.nSound||'texma',avisos})});
  }catch(e){}
}
/* cada vez que cambia algo que se avisa, se re-sincroniza (sin spamear) */
let syncT=null;
function pushTouch(){ clearTimeout(syncT); syncT=setTimeout(()=>pushSync(),4000); }
/* sin licencia no se revisa ni se programa nada */
document.addEventListener('visibilitychange',()=>{
  if(!appAbierta||document.hidden) return;
  checkNotifs(); scheduleTriggers();

window.addEventListener('focus',()=>{ if(appAbierta) checkNotifs(); });

/* `alTerminar` se llama cuando la usuaria sale del último slide.

  w.addEventListener('touchend',e=>{
    if(tx0===null) return;
    const dx=e.changedTouches[0].clientX-tx0; tx0=null;
    if(Math.abs(dx)<55) return;
    if(dx<0&&i<slides.length-1){ i++; paint(); }
    if(dx>0&&i>0){ i--; paint(); }
  });
  paint(); document.body.appendChild(w);
}

/* botón deslizable: arrastrar el círculo hasta el final dispara onDone() */
function wireSlider(sl,onDone){
  const knob=sl.querySelector('.sknob'), fill=sl.querySelector('.sfill');
  let drag=false,x0=0,x=0,max=0,hecho=false,touch=false;
  const medir=()=>{ max=sl.clientWidth-knob.offsetWidth-10; };
  const pos=v=>{ knob.style.transform=`translateX(${v}px)`; fill.style.width=(knob.offsetWidth+10+v)+'px'; };
  const start=e=>{ if(hecho) return; medir(); drag=true; x0=(e.touches?e.touches[0].clientX:e.clientX)-x; };
  const move=e=>{
    if(!drag) return;
    const cx=(e.touches?e.touches[0].clientX:e.clientX);
    x=Math.max(0,Math.min(max,cx-x0)); pos(x);
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(!drag) return; drag=false;
    if(x>=max-4){
      hecho=true; sl.classList.add('done'); pos(max);
      setTimeout(onDone,180);
    }else{
      const g=G();
      if(g) g.to({v:x},{v:0,duration:.28,ease:'power2.out',onUpdate(){ x=this.targets()[0].v; pos(x); }});
      else { x=0; pos(0); }
    }
  };
  sl.addEventListener('touchstart',e=>{ touch=true; start(e); },{passive:true});
  sl.addEventListener('touchmove',move,{passive:false});
  sl.addEventListener('touchend',end);
  sl.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  /* con mouse (o teclado) un click también entra; en el celu hay que deslizar */
  sl.addEventListener('click',()=>{
    if(hecho||touch||x!==0) return;
    hecho=true; sl.classList.add('done'); medir(); pos(max); setTimeout(onDone,180);
  });
}

/* ============================================================
   AVISO DE ACTUALIZACIÓN
   ------------------------------------------------------------
   Como TEXMA se reparte por APK y no por una tienda, nadie se entera
   cuando sale una mejora. Solución: al abrir la app se le pregunta a
   Supabase qué versión es la última publicada (tabla `apps`, columna
   `version`). Si la de la base es mayor que APP_VER, sale el cartel.

   Es una sola consulta de LECTURA con la anon key, que es pública a
   propósito: la política de RLS de la tabla `apps` deja leer nada más
   que id/nombre/version/url_descarga. La service_role key NUNCA va acá.

   Para encenderlo hay que pegar abajo la URL del proyecto y la anon key
   (Supabase → Project Settings → API). Con los campos vacíos la función
   no hace nada y la app sigue andando igual. Ver server/SUPABASE.md.
============================================================ */
const SUPA_URL='https://adwroskikbnbizagelqc.supabase.co';   /* sin barra al final */
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkd3Jvc2tpa2JuYml6YWdlbHFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDQxNTUsImV4cCI6MjEwMTE4MDE1NX0.HmKNizVh2VVh8bQMLs8mMnYbdKKDCKc52krOAcDruh8';   /* anon / public key — pública por diseño */
const APP_ID='texma';
const UPDK='texma_upd';

/* compara '1.2.10' con '1.2.9' de verdad (no como texto): 1 / 0 / -1 */
function verCmp(a,b){
  const pa=String(a).split('.').map(n=>parseInt(n,10)||0);
  const pb=String(b).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0, y=pb[i]||0;
    if(x!==y) return x>y?1:-1;
  }
  return 0;
}

function updEstado(){
  try{ return JSON.parse(localStorage.getItem(UPDK)||'{}'); }catch(e){ return {}; }
}
function updGuardar(st){
  try{ localStorage.setItem(UPDK,JSON.stringify(st)); }catch(e){}
}

async function chequearUpdate(forzar,yaTraido){
  if(!SUPA_URL||!SUPA_ANON) return;
  /* El pedido lo hace updFetch(): ~200 bytes, una sola vez por apertura y
     apenas carga el DOM. Acá solo se decide si sale el cartel. Con `forzar`
     (botón de Ajustes) se vuelve a preguntar de cero, sin colchón. */
  if(forzar) updFetchHecho=null;
  if(!yaTraido||forzar) await updFetch();
  const st=updEstado();
  if(!st.ver||verCmp(st.ver,APP_VER)<=0){ if(forzar) toast('Ya tenés la última ✓'); return; }
  /* «Después» vale mientras no venza el plazo: vencido, el cartel vuelve siempre */
  if(st.visto===st.ver&&!forzar&&!updForzada(st)) return;
  avisoUpdate(st);
}

/* Dispara el chequeo de versión SOLO, en cada apertura, sin que la usuaria
   tenga que ir a buscarlo a Ajustes.
   Antes esto colgaba de que el tutorial estuviera terminado, y si alguien lo
   dejaba a medias no se chequeaba nunca. Ahora simplemente espera a que no
   haya ninguna pantalla del primer arranque encima (van por z-index más alto
   y el cartel quedaría escondido detrás) y ahí pregunta. */
let updEsperando=false;
function primerArranqueVisible(){ return !!($('#wel')||$('#tut')||$('#prof')||$('#onb')||$('#lic')||$('#splash')); }

/* v1.4.4: la CONSULTA se separó del CARTEL.
   Antes las dos cosas colgaban de abrirApp(), o sea de que la licencia
   estuviera activada y de que no hubiera ninguna pantalla de primer arranque
   encima; si algo de eso tardaba, la consulta no salía nunca y el aviso solo
   aparecía yendo a Ajustes a mano. Ahora:
     · updFetch()  → sale apenas carga el DOM, sin esperar nada. Guarda en UPDK.
     · programarChequeoUpdate() → solo espera pantalla libre para mostrar el cartel,
       y ya no se rinde a los 2 minutos. */
let updFetchHecho=null;
function updFetch(){
  if(updFetchHecho) return updFetchHecho;                 /* una sola por apertura */
  updFetchHecho=(async()=>{
    if(!SUPA_URL||!SUPA_ANON) return;
    const st=updEstado();
    try{
      const r=await fetch(
        `${SUPA_URL}/rest/v1/apps?id=eq.${encodeURIComponent(APP_ID)}&select=version,url_descarga`,
        {headers:{apikey:SUPA_ANON,authorization:'Bearer '+SUPA_ANON}});
      if(!r.ok) return;
      const fila=(await r.json())[0];
      if(!fila||!fila.version) return;
      if(fila.version!==st.ver) st.visto='';
      st.ver=fila.version; st.url=fila.url_descarga||''; st.ts=Date.now();
      updGuardar(st);
    }catch(e){}   /* sin internet: ni se entera, no molesta */
  })();
  return updFetchHecho;
}
function programarChequeoUpdate(intento){
  if(updEsperando&&!intento) return;
  updEsperando=true;
  updFetch();                      /* por las dudas: si el DOM ya la disparó, no repite */
  setTimeout(async()=>{
    if(primerArranqueVisible()){
      updEsperando=false;
      if((intento||0)<600) return programarChequeoUpdate((intento||0)+1);  /* ~25 min */
      return;
    }
    updEsperando=false;
    await updFetch();
    chequearUpdate(false,'yaTraido');
  },intento?2500:800);
}

/* ---------- actualización forzada ----------
   La primera vez que se avisa de una versión queda anotada la fecha
   (pv / pvVer). Si a los 5 días la usuaria sigue sin actualizar, el
   cartel pierde el «Después» y se vuelve obligatorio: solo deja tocar
   «Actualizar ahora». Sin link de descarga nunca se fuerza nada. */
const UPD_DIAS_LIMITE=5;
function updForzada(st){
  return !!(st.url&&st.pv&&st.pvVer===st.ver&&Date.now()-st.pv>=UPD_DIAS_LIMITE*864e5);
}

function avisoUpdate(st){
  const hayLink=!!st.url;
  /* fecha del PRIMER aviso de ESTA versión: de acá sale el plazo de gracia */
  if(st.pvVer!==st.ver){ st.pvVer=st.ver; st.pv=Date.now(); updGuardar(st); }
  const forzada=updForzada(st);
  dlg({
    title:forzada?'Hay que actualizar TEXMA':'Hay una TEXMA nueva ♥',
    msg:forzada
      ?`Esta versión (V${APP_VER}) ya quedó vieja y puede fallar. Tocá Actualizar ahora, abrí el archivo que se baja y listo: tus datos quedan como están.`
      :`Tenés la V${APP_VER} y ya salió la V${st.ver}. `+(hayLink
        ?'Tocá Actualizar ahora, abrí el archivo que se baja y listo: tus datos quedan como están.'
        :'Escribinos y te pasamos la actualización.'),
    okTxt:hayLink?'Actualizar ahora':'Entendido',
    cancelTxt:'Después',
    oneBtn:forzada||!hayLink,
  },ok=>{
    st.visto=st.ver; updGuardar(st);
    if(ok&&hayLink){ bajarUpdate(st); return; }   /* el overlay se encarga del resto */
    /* obligatorio de verdad: el cartel vuelve a aparecer al toque y la app
       queda detrás hasta que instale el APK nuevo (al abrirse ya actualizada,
       verCmp corta y esto no corre más) */
    if(forzada) setTimeout(()=>avisoUpdate(st),700);
  });
}

/* ============================================================
   DESCARGA DE LA ACTUALIZACIÓN
   ------------------------------------------------------------
   Antes se abría el navegador de una y la usuaria quedaba sola frente
   a los carteles de Android («archivo dañino», permisos de orígenes
   desconocidos) sin entender nada y con miedo a seguir.
   Ahora primero se ve un overlay que le explica QUÉ va a pasar, y el
   APK se baja adentro de la app con barra de progreso real.
   Cuando terminó, se le pasa el archivo al instalador de Android.

   Todo tiene red de contención: si falta el plugin, si falla la bajada
   o si falla el instalador, se cae al camino de siempre (abrir el link
   en el navegador). El updater NUNCA puede quedar sin salida: es lo que
   nos permite arreglar cualquier otra cosa más adelante.
============================================================ */
let updvT=null;
function updOverlay(){
  let v=$('#updv');
  if(v) return v;
  v=document.createElement('div'); v.id='updv';
  v.innerHTML=`<div class="ubox">
    <div class="uring indet" id="uRing">
      <svg viewBox="0 0 112 112">
        <circle class="rbg" cx="56" cy="56" r="48"/>
        <circle class="rfg" cx="56" cy="56" r="48"/>
      </svg>
      <div class="upct" id="uPct">♥</div>
    </div>
    <h3>¡Descargando actualización!</h3>
    <div class="usub" id="uSub">Preparando la descarga…</div>
    <div class="unota">
      <b>Lo que va a pasar en un ratito:</b>
      Android te va a mostrar avisos de seguridad hablando de archivos «dañinos»
      y te va a pedir permiso para instalar apps de origen desconocido.
      Es lo normal en las apps que no se bajan de la tienda — TEXMA se reparte así.
      <span class="uok">No te asustes: tocá «Instalar igual» y listo ♥</span>
    </div>
    <div class="ufoot" id="uFoot">Dejá TEXMA abierta mientras se baja.</div>
  </div>`;
  document.body.appendChild(v);
  const g=G();
  if(g){
    g.fromTo(v,{opacity:0},{opacity:1,duration:.2});
    g.fromTo(v.querySelector('.ubox'),{scale:.92,y:14},{scale:1,y:0,duration:.34,ease:'back.out(1.6)'});
  }
  return v;
}
function updCerrar(){
  clearTimeout(updvT);
  const v=$('#updv'); if(!v) return;
  const g=G();
  if(g) g.to(v,{opacity:0,duration:.2,onComplete:()=>v.remove()});
  else v.remove();
}
/* pinta el avance: pct null = indeterminado (no sabemos cuánto pesa) */
function updProgreso(pct,sub,foot){
  const ring=$('#uRing'), pl=$('#uPct'), sb=$('#uSub'), ft=$('#uFoot');
  if(!ring) return;
  if(pct==null){ ring.classList.add('indet'); if(pl) pl.textContent='♥'; }
  else{
    ring.classList.remove('indet');
    const p=Math.max(0,Math.min(100,pct));
    ring.querySelector('.rfg').style.strokeDashoffset=(301.6*(1-p/100)).toFixed(1);
    if(pl) pl.textContent=Math.round(p)+'%';
  }
  if(sub&&sb) sb.textContent=sub;
  if(foot&&ft) ft.textContent=foot;
}

async function bajarUpdate(st){
  updOverlay();
  const LN=plug('Filesystem'), FO=plug('FileOpener');
  /* PWA / navegador / falta algún plugin: se explica igual y se abre el link */
  if(!NATIVO||!LN||!FO){
    updProgreso(null,'Abriendo la descarga…','En un segundo se abre el navegador del celu.');
    updvT=setTimeout(()=>{ abrirAfuera(st.url); updCerrar(); },2600);
    return;
  }
  const nombre=`TEXMA-${st.ver}.apk`;
  let quitar=null;
  try{
    updProgreso(0,'Bajando la versión '+st.ver+'…');
    /* el progreso real llega por eventos; si el plugin no los manda,
       queda la ruedita girando y no se rompe nada */
    try{
      const h=await LN.addListener('progress',ev=>{
        if(ev&&ev.contentLength>0){
          const p=ev.bytes/ev.contentLength*100;
          updProgreso(p,`${(ev.bytes/1048576).toFixed(1)} MB de ${(ev.contentLength/1048576).toFixed(1)} MB`);
        }
      });
      quitar=()=>{ try{ h.remove(); }catch(e){} };
    }catch(e){ updProgreso(null,'Bajando la versión '+st.ver+'…'); }

    const r=await LN.downloadFile({url:st.url,path:nombre,directory:'EXTERNAL',progress:true});
    if(quitar) quitar();
    const ruta=r&&(r.path||r.uri);
    if(!ruta) throw new Error('sin ruta del archivo');

    updProgreso(100,'¡Listo! Abriendo el instalador…','Ahora sí: tocá «Instalar igual» cuando Android pregunte.');
    await new Promise(s=>setTimeout(s,900));
    await FO.open({filePath:ruta,contentType:'application/vnd.android.package-archive'});
    /* el instalador quedó abierto encima; se cierra el overlay al volver */
    setTimeout(updCerrar,1500);
  }catch(e){
    if(quitar) quitar();
    console.warn('[TEXMA] no pude bajar/instalar adentro de la app:',e);
    /* plan B de toda la vida: el navegador. La actualización nunca queda trabada */
    updProgreso(null,'Lo termino en el navegador…','Se abre la descarga del celu. Después tocá el archivo bajado.');
    updvT=setTimeout(()=>{ abrirAfuera(st.url); updCerrar(); },2200);
  }
}

/* el link de descarga tiene que salir al navegador del celu, no
   quedarse adentro de la WebView del APK */
function abrirAfuera(url){
  try{
    const w=window.open(url,'_blank','noopener');
    if(!w) location.href=url;
  }catch(e){ location.href=url; }
}

/* ============================================================
   LICENCIA
   ------------------------------------------------------------
   Cómo funciona:
   1. Cada venta genera un CÓDIGO único en el servidor (Vercel /api + Supabase).

async function sha256hex(s){
  try{

      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ console.warn('[TEXMA] crypto.subtle falló, uso SHA-256 en JS',e); }
  return sha256js(s);
}

  }catch(e){ console.error('[TEXMA licencia] no pude verificar la llave maestra',e); return ''; }

const b64uDec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));

async function licVerify(token,diag={}){
  try{
    const [p,sig]=String(token).split('.');
    if(!p||!sig){ diag.motivo='token mal formado (no es payload.firma)'; return null; }
    let ok=false;
    for(const pub of LIC_PUBS){
      const key=await crypto.subtle.importKey('jwk',pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      if(await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64uDec(sig),new TextEncoder().encode(p))){ ok=true; break; }
    }
    if(!ok){ diag.motivo='firma inválida: LIC_PRIV del servidor no es pareja de ninguna clave de LIC_PUBS'; return null; }
    const data=JSON.parse(new TextDecoder().decode(b64uDec(p)));
    if(data.device!==deviceId()){ diag.motivo=`licencia de otro dispositivo (token: ${data.device} · este: ${deviceId()})`; return null; }
    if(data.exp&&Date.now()>data.exp){ diag.motivo='licencia vencida'; return null; }
    return data;
  }catch(e){ diag.motivo='no pude verificar: '+(e&&e.message||e); return null; }
}

   y la consola (console.error '[TEXMA licencia]') el motivo técnico exacto. */
/* código de venta normalizado: mayúsculas y con guiones cada 4 */
function normCodigo(code){
  const c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  return c.length===12?c.match(/.{4}/g).join('-'):String(code||'').trim().toUpperCase();
}
async function licActivate(code){

  const falla=(msg,detalle)=>{
    console.error('[TEXMA licencia] '+detalle,{url,origen:location.origin,nativo:NATIVO});
    return new Error(msg);
  };
  let r;
  try{
    r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({code:String(code).trim().toUpperCase(),device:deviceId()})});
  }catch(e){
    throw falla('Sin conexión con el servidor. Revisá internet y probá de nuevo.',
      `error de red (el fetch ni llegó): ${e&&e.message||e} — ¿servidor apagado, URL mal (${url}) o CORS?`);
  }
  const txt=await r.text().catch(()=> '');
  let j=null;
  try{ j=txt?JSON.parse(txt):{}; }catch(e){
    throw falla('El servidor respondió algo raro. Probá en un rato.',
      `status ${r.status} ${r.statusText} con respuesta NO JSON (¿ruta /api inexistente o la función no compiló?): ${txt.slice(0,300)}`);
  }
  if(!r.ok){
    throw falla(j.error||'No pude activar',
      `status ${r.status} · error: ${j.error||'—'} · detalle del servidor: ${j.detalle||'—'}`);
  }
  if(!j.token) throw falla('No pude activar', `status ${r.status} pero sin token en la respuesta: ${txt.slice(0,300)}`);
  const diag={};
  if(!await licVerify(j.token,diag)){
    throw falla('La licencia que mandó el servidor no es válida. Avisanos.', 'token rechazado: '+diag.motivo);
  }
  localStorage.setItem(LICK,j.token);
  return j.token;
}

     2. Muro de licencia — si no hay código válido, la pantalla de bloqueo

async function arrancar(){

     mientras la usuaria mira la portada, la respuesta de Supabase ya está
     guardada, y el cartel sale apenas la pantalla queda libre. */
  updFetch();

function abrirApp(){
  if(appAbierta) return;          /* con o sin licencia, se abre una sola vez */

  paintTop();
  setInterval(paintTop,60000);
  go('hoy');
  try{ history.replaceState({v:'hoy'},''); }catch(e){}
  animarEntrada();

     suele quedar días con TEXMA abierta en segundo plano y así se entera igual */
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) programarChequeoUpdate();

  setTimeout(()=>{ ['#top','#nav','#fab','#addfab'].forEach(s=>{

    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) nativoProgramar(); });
  } else if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    /* si se publica una versión nueva, recargar sola una vez
       (solo si ya había un service worker: en la primera visita no hace falta) */
    const habiaSW=!!navigator.serviceWorker.controller;
    let recargando=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!habiaSW||recargando) return; recargando=true; location.reload();
    });
    navigator.serviceWorker.addEventListener('message',ev=>{
      if(ev.data&&ev.data.type==='push-resubscribe') pushSubscribe();
    });
    navigator.serviceWorker.register('sw.js')
      .then(r=>{ swReg=r; r.update().catch(()=>{}); return navigator.serviceWorker.ready; })
      .then(r=>{ swReg=r||swReg; startNotifLoop(); })
      .catch(()=>startNotifLoop());
  } else startNotifLoop();
}
arrancar();
</script>
