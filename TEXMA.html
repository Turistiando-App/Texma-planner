<script>
/* ============================================================
   TEXMA · planner personal
   Datos: localStorage 'texma' (importa copias de 'jiom')
============================================================ */
'use strict';

/* ---------- LA VERSIÓN ----------
   Este es el ÚNICO lugar donde se toca el número de versión.
   De acá salen solos:
     · el pie de Ajustes («Hecho con Amor — M.E.G · V…»)
     · el aviso de «hay una TEXMA nueva»
     · package.json y el versionName/versionCode del APK
       (los sincroniza scripts/build-web.mjs en cada npm run sync)
   Al sacar un parche: cambiar el número acá y nada más.        */
const APP_VER='1.7.3';

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoyISO=()=>iso(new Date());
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DL=['L','M','X','J','V','S','D']; // lunes primero
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const G=()=>(!RM && window.gsap)?window.gsap:null;

function pDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fShort(s){ if(!s) return ''; const d=pDate(s); return `${d.getDate()} ${MES[d.getMonth()].slice(0,3)}`; }
function fLong(s){ const d=pDate(s); return `${DIA[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}`; }
/* formato de plata: SIEMPRE con $ y puntos de miles (es-AR), nunca números crudos */
const NF_ARS=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});

function migrate(d){
  const st={...JSON.parse(JSON.stringify(DEF.settings)),...(d.settings||{})};
  /* Esto va ANTES del blindaje de abajo: son banderas que se deducen de que la
     clave venga SIN definir (copia vieja = usuaria que ya usaba TEXMA). Si el
     blindaje las completa primero con el false de fábrica, se pierde el dato y
     le vuelven a salir la bienvenida y el tutorial. */
  const crudo=d.settings||{};
  if(crudo.profiled===undefined) st.profiled=!!(st.name||'').trim();
  if(crudo.welcomed===undefined) st.welcomed=!!st.profiled;
  if(crudo.tutorDone===undefined) st.tutorDone=!!st.profiled;
  /* v1.4.4 · MISMO blindaje que las claves de nivel 1, pero DENTRO de settings.
     Una copia vieja no trae `fit`, ni `nMods`, ni lo que se agregue mañana, y
     cada módulo nuevo se venía anotando a mano acá abajo: el día que uno se
     olvidaba, la copia vieja reventaba en el primer acceso y se perdía TODO
     porque la importación quedaba a medias. Ahora sale solo de DEF.settings.
     Ojo con el orden: primero el default, después lo del archivo, así lo que
     la usuaria tenía guardado SIEMPRE gana sobre el valor de fábrica. */
  Object.keys(DEF.settings).forEach(k=>{
    const def=DEF.settings[k];
    if(Array.isArray(def)){ if(!Array.isArray(st[k])) st[k]=JSON.parse(JSON.stringify(def)); }
    else if(def&&typeof def==='object'){
      st[k]=(st[k]&&typeof st[k]==='object'&&!Array.isArray(st[k]))
        ? {...JSON.parse(JSON.stringify(def)),...st[k]}
        : JSON.parse(JSON.stringify(def));
    }
    else if(st[k]===undefined||st[k]===null) st[k]=def;
  });
  /* cats es el único caso especial: son DOS listas adentro de un objeto */
  if(!Array.isArray(st.cats.in)) st.cats.in=[];
  if(!Array.isArray(st.cats.out)) st.cats.out=[];
  /* el modo oscuro se eliminó: TEXMA es siempre clara */
  delete st.theme; delete st.dark; delete st.fixDark;
  if(typeof st.photo!=='string') st.photo='';
  if(typeof st.invBanner!=='string') st.invBanner='';
  if(typeof st.invTitle!=='string') st.invTitle='';
  if(!/^#[0-9a-f]{6}$/i.test(st.banner||'')) st.banner='#F2803C';
  /* (profiled / welcomed / tutorDone se resolvieron arriba, antes del blindaje:
     v1.4.2 · bienvenida y tutorial son SOLO para quien recién instala) */
  const s={...JSON.parse(JSON.stringify(DEF)),...d,settings:st};
  /* Blindaje: toda clave del estado tiene que tener la FORMA que espera el
     código. Antes se listaban a mano las claves nuevas y era cuestión de
     tiempo que un módulo nuevo quedara afuera y una copia vieja explotara en
     el primer .forEach(). Ahora se saca sola de DEF: si mañana se agrega otro
     módulo, las copias viejas lo reciben vacío y siguen andando. */
  Object.keys(DEF).forEach(k=>{
    if(k==='settings') return;
    if(Array.isArray(DEF[k])){ if(!Array.isArray(s[k])) s[k]=[]; }
    else if(DEF[k]&&typeof DEF[k]==='object'){
      if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k])) s[k]={};
    }
  });
  s.investments.forEach(m=>{ if(!Array.isArray(m.hist)) m.hist=[]; });
  /* v1.7 · Mercería: el stock pasa al modelo nuevo (titulo, cantidad, unidad…).
     Las copias viejas traen {name,cat,unit,qty,min,cost,price}: se traducen
     acá, así nada se pierde ni al abrir ni al importar una copia. */
  s.stock=s.stock.filter(i=>i&&typeof i==='object').map(stockNorm);
  /* v1.4: tratamientos de medicamentos + inversiones en pareja y multimoneda */
  s.meds.forEach(m=>{
    if(m.start===undefined) m.start='';          /* '' = desde siempre */
    if(m.durationDays===undefined) m.durationDays=0;  /* 0 = crónico */
  });
  if(!Array.isArray(s.settings.invMembers)||!s.settings.invMembers.length)
    s.settings.invMembers=JSON.parse(JSON.stringify(DEF.settings.invMembers));
  /* v1.4.1: la persona 2 ya no viene puesta de fábrica. Si quedó el «Mi amor»
     del default viejo y nunca aportó nada, se limpia; con aportes se respeta. */
  if(s.settings.invMembers.length>1){
    const p2=s.settings.invMembers[1];
    const usado=s.investments.some(m=>(m.hist||[]).some(h=>h.who===p2.id));
    if(!usado&&p2.name==='Mi amor') s.settings.invMembers=s.settings.invMembers.slice(0,1);
  }
  /* v1.5 · el frasco pasa de 2 personas fijas a una lista de hasta 10.
     OJO: los `id` que YA existen no se tocan nunca — cada aporte viejo apunta
     al suyo con h.who y renombrarlos dejaría la plata sin dueño. Acá solo se
     completa lo que falta (un id vacío, un color inválido) y se recorta si
     alguien metiera a mano más de 10. */
  s.settings.invMembers=s.settings.invMembers
    .filter(p=>p&&typeof p==='object').slice(0,INV_MAX);
  s.settings.invMembers.forEach((p,i)=>{
    if(!p.id) p.id='p'+uid();
    if(typeof p.name!=='string') p.name='';
    if(!/^#[0-9a-f]{6}$/i.test(p.color||'')) p.color=INV_COLORS[i%INV_COLORS.length];
  });
  s.investments.forEach(m=>{
    if(m.currency!=='USD') m.currency='ARS';
    m.hist.forEach(h=>{ if(h.who===undefined) h.who=''; }); /* '' = aporte viejo, "juntos" */
  });
  /* v1.4: pagos recurrentes con moneda + cotización del dólar + pre-avisos */
  if(!(+s.settings.usdRate>0)) s.settings.usdRate=1500;
  { const pd=+s.settings.nMods.pagosDias;
    s.settings.nMods.pagosDias=Number.isFinite(pd)?Math.max(0,Math.min(5,pd)):2; }
  s.recurring.forEach(r=>{ if(r.currency!=='USD') r.currency='ARS'; });
  /* v1.4: entrenamiento y nutrición */
  if(!s.settings.fit||typeof s.settings.fit!=='object') s.settings.fit={...DEF.settings.fit};
  if(!Array.isArray(s.settings.fitActs)) s.settings.fitActs=[];
  if(!s.fitDays||typeof s.fitDays!=='object') s.fitDays={};
  if(!s.fired||typeof s.fired!=='object') s.fired={};
  /* v1.5 · tratamientos (acné, ortodoncia, dermatología…).
     Las fotos de un tratamiento duran meses o años: NO pueden vivir en el
     estado. En el celular se guardan como archivos con @capacitor/filesystem
     y acá adentro queda SOLO la ruta. En el navegador (PWA / probar en la
     compu) no hay disco propio, así que ahí cae en la foto embebida. */
  s.treatments.forEach(t=>{
    if(typeof t.name!=='string') t.name='Tratamiento';
    if(t.kind===undefined) t.kind='';
    if(t.start===undefined) t.start='';
    if(t.note===undefined) t.note='';
    if(!t.created) t.created=Date.now();
    if(!Array.isArray(t.photos)) t.photos=[];
    t.photos=t.photos.filter(p=>p&&typeof p==='object'&&(p.path||p.data));
    t.photos.forEach(p=>{
      if(!p.id) p.id=uid();
      if(!p.date) p.date=hoyISO();
      if(typeof p.note!=='string') p.note='';
    });
  });
  s.shopping.forEach(i=>{ if(i.cat===undefined) i.cat='General'; });
  s.sewing.forEach(p=>{
    if(p.price===undefined) p.price='';
    if(p.deposit===undefined) p.deposit='';
    if(!Array.isArray(p.notions)) p.notions=[];
    if(!Array.isArray(p.extras)) p.extras=[];
    if(p.clientMaterial===undefined) p.clientMaterial=true;
    if(p.paid===undefined) p.paid=false;
    if(p.delivered===undefined) p.delivered=false;
    if(p.cancelled===undefined) p.cancelled=false;
    if(p.done&&!p.doneAt) p.doneAt=p.updated||p.created||Date.now();
  });
  return s;
}

  catch(e){ ok=false; if(!callado) toast('Memoria llena — borrá alguna foto de proyecto'); }

/* ---------- rescate cuando la copia no entra en la memoria ----------
   Lo que ocupa lugar son las fotos (van en base64 adentro del JSON): las de
   costura, las metas de inversión, el banner y la foto de perfil. El texto
   —plata, agenda, notas— pesa nada. Antes que perder TODO, se re-comprimen
   las fotos y se intenta de nuevo. Perder nitidez es infinitamente mejor
   que perder los datos. */
function achicarDataURL(src,max,q){
  return new Promise(listo=>{
    if(typeof src!=='string'||!src.startsWith('data:image')) return listo(src);
    const img=new Image();
    img.onload=()=>{
      try{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const out=c.toDataURL('image/jpeg',q);
        listo(out.length<src.length?out:src);   /* si no mejora, se deja la original */
      }catch(e){ listo(src); }
    };
    img.onerror=()=>listo(src);
    img.src=src;
  });
}
/* recorre el estado y comprime cada foto que encuentre */
async function compactarFotos(s,max,q){
  const campos=[
    [s.settings,'photo'],[s.settings,'invBanner'],
    ...s.sewing.map(p=>[p,'photo']),
    ...s.sewing.flatMap(p=>Array.isArray(p.photos)?p.photos.map((_,i)=>[p.photos,i]):[]),
    ...s.investments.map(m=>[m,'img']),
    ...s.stock.flatMap(i=>Array.isArray(i.fotos)?i.fotos.map((_,k)=>[i.fotos,k]):[]),
  ];
  for(const [obj,k] of campos){
    if(obj&&typeof obj[k]==='string'&&obj[k].startsWith('data:image'))
      obj[k]=await achicarDataURL(obj[k],max,q);
  }
}
/* guarda; si no entra, compacta fotos en dos pasadas y reintenta */
async function guardarConRescate(){
  if(save(true)) return {ok:true};
  for(const [max,q] of [[900,.6],[600,.5]]){
    await compactarFotos(S,max,q);
    if(save(true)) return {ok:true,achicado:true};
  }
  return {ok:false};
}

/* ---------- tema / paleta ---------- */
function hexHsl(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60; }
  const l=(mx+mn)/2, s=d?d/(1-Math.abs(2*l-1)):0;
  return [h,s*100,l*100];
}
function hslHex(h,s,l){
  s/=100;l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  const[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}

/* barra de estado del celu (meta theme-color en la web, plugin en el APK) */
function pintarBarra(){
  document.querySelector('meta[name="theme-color"]').setAttribute('content',barraColor());
  try{
    const SB=window.Capacitor?.Plugins?.StatusBar;
    if(SB){ SB.setBackgroundColor({color:barraColor()}); SB.setStyle({style:sbStyle()}); }
  }catch(e){}
}

/* TEXMA es siempre clara: no hay modo oscuro. */
function applyTheme(){
  document.body.dataset.pal=PALS.some(p=>p[0]===S.settings.pal)?S.settings.pal:'rosa';
  const [h,s]=hexHsl(palBase()), st=document.body.style;
  st.setProperty('--tint',hslHex(h,Math.min(s,65),91));
  st.setProperty('--mid',hslHex(h,Math.min(s,62),64));
  st.setProperty('--deep',hslHex(h,Math.min(s,80),46));
  st.setProperty('--aink',hslHex(h,Math.min(s,60),32));
  const bc=bannerColor(), [bh,bs]=hexHsl(bc);
  st.setProperty('--ban',bc);
  st.setProperty('--ban2',hslHex(bh,Math.min(bs,85),Math.max(24,Math.min(52,bs>8?42:20))));
  document.querySelector('meta[name="color-scheme"]').setAttribute('content','only light');
  /* en el APK, la barra de estado del celu también acompaña */
  pintarBarra();
}
/* qué estilo le toca a la barra de estado según la cabecera elegida:
   cabecera oscura → estilo DARK (íconos blancos) · clara → LIGHT (íconos negros).
   Sin esto, un azul oscuro dejaba reloj y batería negros, ilegibles. */
function sbStyle(){
  const h=barraColor().replace('#','');
  const r=parseInt(h.slice(0,2),16)||0, g=parseInt(h.slice(2,4),16)||0, b=parseInt(h.slice(4,6),16)||0;
  const lum=(0.299*r+0.587*g+0.114*b)/255;   /* luminosidad percibida 0–1 */
  return lum<0.55?'DARK':'LIGHT';
}

async function askNotif(){

  let p=Notification.permission;

}

function closeSheet(skipHist){
  if(!sheetOpen) return; sheetOpen=false; sheetDirty=false;
  veil.classList.remove('on');
  const fb=document.getElementById('fab'); if(fb) fb.classList.remove('open');
  $('#addfab').classList.toggle('hide',!(VIEWS[cur]&&VIEWS[cur].fab));

function attemptCloseSheet(then){
  if(!sheetOpen){ if(then) then(); return; }
  if(!sheetDirty){ closeSheet(); if(then) then(); return; }
  dlg({title:'¿Descartar cambios?',msg:'Hay cambios sin guardar en este formulario.',
       okTxt:'Descartar',cancelTxt:'Seguir editando',danger:true},ok=>{
    if(ok){ closeSheet(); if(then) then(); }

}

/* ---------- pulsación larga (hold) ----------
   Medio segundo con el dedo apretado = menú de acciones, como en iOS y
   Android. Se cancela si el dedo se mueve (era un scroll) y se traga el
   click que el navegador manda al soltar, para que no se abra ADEMÁS lo
   que la tarjeta hace al tocarla.
   OJO: hay que llamarlo ANTES de agregarle el listener de 'click' al
   elemento — en el mismo nodo los listeners corren en orden de alta.   */
function holdPress(el,fn,ms){
  let t=null, x0=0, y0=0, disparo=false;
  const cancelar=()=>{ if(t){ clearTimeout(t); t=null; } };
  el.addEventListener('click',e=>{
    if(disparo){ disparo=false; e.preventDefault(); e.stopImmediatePropagation(); }
  });
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    disparo=false; x0=e.clientX; y0=e.clientY; cancelar();
    t=setTimeout(()=>{
      t=null; disparo=true;
      try{ navigator.vibrate&&navigator.vibrate(18); }catch(_){}
      fn(e);
    },ms||500);
  });
  el.addEventListener('pointermove',e=>{
    if(t&&Math.hypot(e.clientX-x0,e.clientY-y0)>12) cancelar();   /* estaba scrolleando */
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,cancelar));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

    <button class="btn" data-act="x" style="width:100%;margin-top:4px">Cancelar</button>`);

}

     si no, el botón «atrás» del celu armaba la vista detrás del bloqueo */
  if(!appAbierta) return;

         okTxt:'Descartar',cancelTxt:'Seguir editando',danger:true},ok=>{

/* ---------- HOME · buscador ----------
   Busca en lo que ya está guardado (nada sale del celu) y devuelve
   [sección, etiqueta, título, detalle, acción] */
function buscarTodo(q){
  const n=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const w=n(q).trim(); if(w.length<2) return [];
  /* cada palabra tiene que aparecer en algún campo: «vestido ana» encuentra
     el vestido de Ana aunque las palabras estén en campos distintos */
  const pals=w.split(/\s+/).filter(Boolean);
  const hay=(...xs)=>{ const t=xs.map(n).join(' '); return pals.every(p=>t.includes(p)); };
  const out=[];
  /* cada módulo por separado: un dato roto en uno no deja sin resultados a los otros */
  const mod=(nombre,fn)=>{ try{ fn(); }catch(e){ console.warn('[TEXMA buscador] falló '+nombre,e); } };
  const TIPO={vestido:'vestido',prenda:'prenda',arreglo:'arreglo',otro:'otro'};
  mod('costura',()=>S.sewing.forEach(p=>{
    if(hay(p.name,p.client,p.notes,TIPO[p.type]||p.type,'costura proyecto'))
      out.push(['costura','costura',p.name||'Sin nombre',[p.client,p.due?'entrega '+fShort(p.due):''].filter(Boolean).join(' · ')||'proyecto',()=>projDetail(p)]);
  }));
  mod('mercería',()=>{ if(S.settings.stockOn) S.stock.forEach(x=>{
    if(hay(x.titulo,x.categoria,x.subcategoria,'mercería stock'))
      out.push(['stock','mercería',x.titulo,[x.subcategoria,`stock ${fCant(x.cantidad)} ${uniTxt(x)}`].filter(Boolean).join(' · '),()=>stockSheet(x)]);
  }); });
  mod('agenda',()=>S.events.forEach(e=>{
    if(hay(e.title,e.place,e.notes,e.type,'agenda'))
      out.push(['cal','agenda',e.title||'Evento',[e.date?fShort(e.date):'',e.time].filter(Boolean).join(' · '),()=>eventForm(e)]);
  }));
  mod('tareas',()=>S.tasks.forEach(t=>{
    if(hay(t.title,t.notes,'tarea'))
      out.push(['tareas','tarea',t.title||'Tarea',t.done?'hecha ✓':'pendiente',()=>taskForm(t)]);
  }));
  mod('notas',()=>S.notes.forEach(x=>{
    if(hay(x.title,x.body,'nota'))
      out.push(['notas','nota',x.title||'Nota',String(x.body||'').slice(0,50),()=>noteView(x)]);
  }));
  mod('compras',()=>S.shopping.forEach(x=>{
    if(hay(x.name,x.cat,'compra'))
      out.push(['compras','compra',x.name||'Producto',x.cat||'lista de compras',()=>shopForm(x)]);
  }));
  return out.slice(0,15);
}

/* Cuánto antes avisar. El 0 es «a la hora del evento» y es el default de
   siempre: los eventos viejos, que no tienen \`remind\`, siguen igual. */
const REMIND=[[0,'A la hora'],[10,'10 min antes'],[60,'1 hora antes'],[1440,'1 día antes']];
const remOf=e=>{
  const r=(e&&Array.isArray(e.remind)&&e.remind.length)?e.remind:[0];
  return [...new Set(r.map(x=>Math.max(0,+x||0)))].sort((a,b)=>a-b);
};
const remTxt=o=>o===0?'a la hora':o<60?`${o} min antes`:o<1440?`${o/60} h antes`:`${o/1440} día${o>1440?'s':''} antes`;

/* ============================================================
   CALCULADORA DE COSTURA
   ------------------------------------------------------------
   Teclado propio (no el del celu) para sacar fracciones de tela y
   medidas sin salir del formulario. El resultado se pega directo en
   cualquiera de las medidas del proyecto con «Usar este valor».

   El parser es a mano a propósito: con eval() cualquier texto que
   entre a la app sería código ejecutable. Acá solo entran números,
   + − × ÷ y paréntesis; cualquier otra cosa devuelve null.
============================================================ */
function calcTok(txt){
  const t=String(txt).replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(/[^0-9.+\-*/() ]/.test(t)) return null;
  return t.match(/\d+\.?\d*|\.\d+|[+\-*/()]/g)||[];
}
/* shunting-yard → RPN → resultado. null si la cuenta está a medias. */
function calcEval(txt){
  const tk=calcTok(txt);
  if(!tk||!tk.length) return null;
  const PR={'+':1,'-':1,'*':2,'/':2};
  const out=[], ops=[];
  let esperoNum=true;
  for(const t of tk){
    if(/^[\d.]/.test(t)){ out.push(parseFloat(t)); esperoNum=false; continue; }
    if(t==='('){ ops.push(t); esperoNum=true; continue; }
    if(t===')'){
      while(ops.length&&ops[ops.length-1]!=='(') out.push(ops.pop());
      if(!ops.length) return null;
      ops.pop(); esperoNum=false; continue;
    }
    if(esperoNum){
      /* signo, no operación: -5 o (-3+2) */
      if(t==='-') out.push(0);
      else if(t==='+') continue;
      else return null;
    }
    while(ops.length&&PR[ops[ops.length-1]]>=PR[t]) out.push(ops.pop());
    ops.push(t); esperoNum=true;
  }
  while(ops.length){ const o=ops.pop(); if(o==='(') return null; out.push(o); }
  const st=[];
  for(const o of out){
    if(typeof o==='number'){ st.push(o); continue; }
    const b=st.pop(), a=st.pop();
    if(a===undefined||b===undefined) return null;
    if(o==='+') st.push(a+b);
    else if(o==='-') st.push(a-b);
    else if(o==='*') st.push(a*b);
    else{ if(!b) return null; st.push(a/b); }
  }
  if(st.length!==1||!isFinite(st[0])) return null;
  return st[0];
}
/* 12.5 → «12,5» · 12.00 → «12» (las medidas van en cm: 2 decimales sobran) */
function calcFmt(n){
  if(n===null||n===undefined||!isFinite(n)) return '—';
  const r=Math.round(n*100)/100;
  return String(r).replace('.',',');
}
/* «90+» todavía no es una cuenta: para el visor se le sacan los
   operadores colgados y los paréntesis sin cerrar, así el número grande
   nunca queda en «—» mientras la usuaria escribe. */
function calcParcial(txt){
  let t=String(txt);
  while(t.length){
    const abren=(t.match(/\(/g)||[]).length-(t.match(/\)/g)||[]).length;
    const v=calcEval(t+')'.repeat(Math.max(0,abren)));
    if(v!==null) return v;
    t=t.slice(0,-1);
  }
  return null;
}
const CALC_KEYS=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','⌫','='];

function cerrarCalc(sinHist){
  const ov=document.getElementById('calcov');
  if(!ov) return;
  ov.remove();
  if(!sinHist&&history.state&&history.state.calc){ histSuppress++; try{ history.back(); }catch(e){} }
}

function openCalc(opt){
  opt=opt||{};
  cerrarCalc(true);
  const targets=opt.targets||[];
  const ov=document.createElement('div'); ov.id='calcov';
  ov.innerHTML=`<div class="cbk"></div>
    <div class="cpan">
      <div class="cph"><div class="cpt">Calculadora</div><button type="button" class="cpx" data-cx>✕</button></div>
      <div class="cdisp"><div class="cexp" id="cExp">&nbsp;</div><div class="cres" id="cRes">0</div></div>
      <div class="cfrac">${[2,3,4,6].map(d=>`<button type="button" class="chip" data-frac="${d}">÷${d}</button>`).join('')}<button type="button" class="chip" data-frac="0.5">×½</button></div>
      <div class="ckeys">${CALC_KEYS.map(k=>`<button type="button" class="ck ${'÷×−+='.includes(k)?'op':''}${k==='C'||k==='⌫'?' fn':''}" data-k="${k}">${k}</button>`).join('')}</div>
      ${targets.length?`<div class="fld" style="margin:13px 0 0"><label>Pegar en</label>
        <select id="cTgt">${targets.map(t=>`<option value="${t.k}"${t.k===opt.target?' selected':''}>${esc(t.label)}</option>`).join('')}</select></div>`:''}
      <div class="btnrow"><button type="button" class="btn" data-cx>Cerrar</button>
        <button type="button" class="btn primary" data-cuse>${targets.length?'Usar este valor':'Copiar'}</button></div>
    </div>`;
  document.body.appendChild(ov);
  try{ history.pushState({calc:1,v:cur},''); }catch(e){}
  const g=G(); if(g) g.fromTo(ov.querySelector('.cpan'),{y:'100%'},{y:'0%',duration:.34,ease:'power3.out'});

  let exp=String(opt.seed||'').replace('.',',');
  const expEl=ov.querySelector('#cExp'), resEl=ov.querySelector('#cRes');
  const valor=()=>{ const v=calcParcial(exp); return v===null?0:v; };
  const pintar=()=>{
    expEl.textContent=exp||'\u00a0';
    resEl.textContent=exp===''?'0':calcFmt(calcParcial(exp));
  };
  const tecla=k=>{
    if(k==='C') exp='';
    else if(k==='⌫') exp=exp.slice(0,-1);
    else if(k==='='){
      const v=calcParcial(exp);
      if(v===null){ toast('Escribí una cuenta primero'); return; }
      exp=calcFmt(v);
    }
    else exp+=k;
    pintar();
  };
  ov.querySelectorAll('[data-k]').forEach(bt=>bt.addEventListener('click',()=>tecla(bt.dataset.k)));
  ov.querySelectorAll('[data-frac]').forEach(bt=>bt.addEventListener('click',()=>{
    const d=parseFloat(bt.dataset.frac), v=valor();
    exp=calcFmt(d===0.5?v*0.5:v/d);
    pintar();
  }));
  /* teclado físico (escritorio, o celu con teclado) */
  const onKey=e=>{
    const k=e.key;
    if(k==='Enter'||k==='='){ e.preventDefault(); tecla('='); return; }
    if(k==='Backspace'){ e.preventDefault(); tecla('⌫'); return; }
    if(k==='Escape'){ e.preventDefault(); cerrar(); return; }
    if(k==='Delete'){ e.preventDefault(); tecla('C'); return; }
    const M={'*':'×','x':'×','/':'÷',':':'÷','-':'−','.':','};
    if(/^[0-9]$/.test(k)||'+()'.indexOf(k)>=0||M[k]){ e.preventDefault(); tecla(M[k]||k); }
  };
  document.addEventListener('keydown',onKey);
  const cerrar=()=>{ document.removeEventListener('keydown',onKey); cerrarCalc(); };
  ov.querySelectorAll('[data-cx]').forEach(x=>x.addEventListener('click',cerrar));
  ov.querySelector('.cbk').addEventListener('click',cerrar);
  ov.querySelector('[data-cuse]').addEventListener('click',()=>{
    const v=calcParcial(exp);
    if(v===null&&exp!==''){ toast('Escribí una cuenta primero'); return; }
    const num=Math.round((v===null?0:v)*100)/100;
    if(num<0) return toast('Una medida no puede ser negativa');
    if(targets.length&&opt.onUse){
      const k=ov.querySelector('#cTgt').value;
      if(opt.onUse(k,num)===false) return;
      cerrar();
      return;
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(String(num)).then(()=>toast('Copiado: '+calcFmt(num)),()=>toast('Resultado: '+calcFmt(num)));
    else toast('Resultado: '+calcFmt(num));
  });
  pintar();
}

/* ============================================================
   IMÁGENES · leer, achicar y dejar SIEMPRE un JPEG
   ------------------------------------------------------------
   La galería del celular devuelve lo que se le canta: HEIC/HEIF de una
   cámara nueva, WebP de WhatsApp, PNG de 12 MP, o un archivo que ni
   siquiera es una imagen. La versión vieja hacía todo adentro de un
   `img.onload` sin try/catch: si `drawImage` o `toDataURL` tiraban (fotos
   enormes = canvas sin memoria), la excepción se perdía, el callback nunca
   se llamaba y la app quedaba muda. Eso era «romperse en silencio».
   Ahora: dos caminos de decodificación, achicado en mitades, fondo blanco
   (si no, un PNG transparente sale con fondo negro al pasar a JPEG) y
   SIEMPRE un toast con el motivo real.
============================================================ */
const IMG_LADO_MAX=4096;              /* arriba de esto la WebView se queda sin canvas */
const IMG_PESO_MAX=60*1024*1024;      /* 60 MB: eso ya no es una foto */

const imgEsHeic=f=>{
  const t=String(f&&f.type||'').toLowerCase(), n=String(f&&f.name||'').toLowerCase();
  return /hei[cf]/.test(t)||/\.(heic|heif)$/.test(n);
};

/* camino 1: <img> + objectURL. Es el que respeta la orientación del EXIF. */
function imgDesdeTag(file){
  return new Promise((res,rej)=>{
    let url;
    try{ url=URL.createObjectURL(file); }
    catch(e){ return rej(new Error('no-abre')); }
    const im=new Image(); im.decoding='async';
    let listo=false;
    const cerrar=()=>{ try{ URL.revokeObjectURL(url); }catch(e){} };
    im.onload =()=>{ listo=true; cerrar(); res(im); };
    im.onerror=()=>{ listo=true; cerrar(); rej(new Error('no-decodifica')); };
    setTimeout(()=>{ if(!listo){ cerrar(); rej(new Error('tarda-demasiado')); } },25000);
    im.src=url;
  });
}
/* camino 2: createImageBitmap, que en algunas WebView entiende formatos que
   el <img> no. `from-image` para que no salga rotada. */
async function imgDecodificar(file){
  try{ return await imgDesdeTag(file); }
  catch(e1){
    if(window.createImageBitmap){
      try{
        const bm=await createImageBitmap(file,{imageOrientation:'from-image'});
        if(bm&&bm.width) return bm;
      }catch(e2){ /* tampoco: cae en el error de abajo */ }
    }
    throw e1;
  }
}
function imgLienzo(src,w,h){
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const x=c.getContext('2d',{alpha:false});
  if(!x) throw new Error('Este celular no me dio un canvas para trabajar la foto');
  x.imageSmoothingQuality='high';
  x.fillStyle='#ffffff'; x.fillRect(0,0,w,h);   /* transparencia → blanco, no negro */
  x.drawImage(src,0,0,w,h);
  return c;
}
/* file → dataURL JPEG. Tira Error con motivo si algo falla. */
async function imgAJpeg(file,max){
  if(!file) throw new Error('No llegó ningún archivo');
  if(file.size>IMG_PESO_MAX)
    throw new Error(`Esa foto pesa ${Math.round(file.size/1048576)} MB: es demasiado grande`);

  const src=await imgDecodificar(file);
  const w0=src.width||src.naturalWidth||0, h0=src.height||src.naturalHeight||0;
  if(!w0||!h0) throw new Error('La imagen vino vacía (0 × 0 píxeles)');

  const lim=Math.min(max||800,IMG_LADO_MAX);   /* 800 = el default de siempre */
  /* bajar de 12 MP a 900 px de un saque pide un drawImage carísimo y deja
     bordes sucios: se va por mitades hasta quedar cerca, que es barato. */
  let cur=src, cw=w0, ch=h0;
  while(Math.max(cw,ch)>lim*2){
    cw=Math.max(1,Math.round(cw/2)); ch=Math.max(1,Math.round(ch/2));
    cur=imgLienzo(cur,cw,ch);
  }
  const sc=Math.min(1,lim/Math.max(cw,ch));
  const c=imgLienzo(cur,Math.max(1,Math.round(cw*sc)),Math.max(1,Math.round(ch*sc)));
  if(src.close){ try{ src.close(); }catch(e){} }   /* ImageBitmap: liberar ya */

  let out='';
  for(const q of [.72,.6,.45]){                    /* si sale gigante, se aprieta más */
    out=c.toDataURL('image/jpeg',q);
    if(out.length<=6e6) break;
  }
  if(!out||out.indexOf('data:image/jpeg')!==0||out.length<128)
    throw new Error('No pude convertir esa foto a JPEG');
  return out;
}
/* el motivo, en castellano y con el dato que sirve para entender qué pasó */
function imgMotivo(e,file){
  const m=String(e&&e.message||e||'');
  const tipo=String(file&&file.type||'').trim()||'formato desconocido';
  if(m==='no-decodifica'||m==='no-abre'||m==='tarda-demasiado'){
    /* adentro del APK esto ya casi no pasa: la conversión la hace Android.
       Queda para la PWA, donde no hay plugin que decodifique HEIC. */
    if(imgEsHeic(file))
      return NATIVO
        ? 'Esa foto es HEIC y no la pude convertir. Probá sacándola de nuevo desde TEXMA'
        : 'Esa foto es HEIC y el navegador no la convierte. Instalá TEXMA en el celu (ahí entran todas) o poné la cámara en «JPEG / Máxima compatibilidad»';
    if(m==='tarda-demasiado') return 'Esa foto tardó demasiado en abrirse — probá con una más chica';
    return `No pude leer esa imagen (${tipo})`;
  }
  return m||'No pude leer esa imagen';
}
/* API de siempre: shrinkImg(file, cb, max). `onErr` es opcional. */
function shrinkImg(file,cb,max,onErr){
  imgAJpeg(file,max).then(d=>{
    try{ cb(d); }
    catch(e){ console.error('[TEXMA] la foto se procesó pero falló al guardarse:',e); toast('No pude guardar esa foto'); }
  }).catch(e=>{
    const msg=imgMotivo(e,file);
    console.warn('[TEXMA] imagen rechazada:',{nombre:file&&file.name,tipo:file&&file.type,peso:file&&file.size,error:e});
    toast(msg);
    if(onErr) onErr(e,msg);
  });
}

      <div class="fld"><label>Seña recibida</label><input id="fSe" type="number" inputmode="decimal" step="0.01" min="0" value="${p.deposit??''}" placeholder="0"></div>
    </div>
    <div class="fld"><label>Avíos usados · cierres, hilos, botones</label><div id="fAv"></div></div>
    <div class="fld"><label>¿El cliente trajo el material?</label>
      <div class="seg sMat">
        <button data-val="si" class="${p.clientMaterial?'on':''}">Sí, lo trajo</button>
        <button data-val="no" class="${p.clientMaterial?'':'on'}">No, lo puse yo</button>
      </div></div>
    <div id="fExW" style="${p.clientMaterial?'display:none':''}">

      <div class="tot" id="tExR"><span class="tl">Materiales míos</span><span class="tv" id="tEx">—</span></div>

        <div class="chip ${p.delivered?'on':''}" data-val="delivered">Entregado</div>

      </div></div>

    <div class="btnrow">${pr?delBtn():''}<button class="btn primary" data-ok>Guardar</button></div>`);
  segWire(b,'.sTipo'); segWire(b,'.sMat'); chipsWire(b,'.cEst');
  /* dinero */
  let notions=(p.notions||[]).map(r=>({...r})), extras=(p.extras||[]).map(r=>({...r}));
  rowsEditor(b,'#fAv',notions,'Cierre, hilo, botón…','Agregar avío');
  rowsEditor(b,'#fEx',extras,'Tela, entretela, forro…','Agregar material');
  const recalc=()=>{
    const mine=segVal(b,'.sMat')==='no';
    const tmp={price:b.querySelector('#fP').value,deposit:b.querySelector('#fSe').value,
      notions,extras,clientMaterial:!mine};
    const c=projMath(tmp);
    b.querySelector('#tPre').textContent=fMoney(c.price);
    b.querySelector('#tEx').textContent=fMoney(c.extras);
    b.querySelector('#tExR').style.display=mine?'':'none';
    b.querySelector('#tTot').textContent=fMoney(c.total);
    b.querySelector('#tSe').textContent=fMoney(c.dep);
    b.querySelector('#tSal').textContent=fMoney(c.saldo);
    b.querySelector('#tAv').textContent=fMoney(c.avios);
    b.querySelector('#tGan').textContent=fMoney(c.gan);
  };
  b.addEventListener('recalc',recalc);
  b.querySelectorAll('#fP,#fSe').forEach(i=>i.addEventListener('input',recalc));
  b.querySelectorAll('.sMat button').forEach(bt=>bt.addEventListener('click',()=>{
    b.querySelector('#fExW').style.display=bt.dataset.val==='no'?'':'none';
    recalc();
  }));
  recalc();
  /* cálculo automático al lado de cada medida */
  const updCalc=()=>{
    b.querySelectorAll('[data-c]').forEach(sp=>{
      const k=sp.dataset.c, v=parseFloat(b.querySelector(`[data-m="${k}"]`).value);
      sp.textContent=isNaN(v)?`÷${CALC[k]}`:`÷${CALC[k]}=${(v/CALC[k]).toFixed(1)}`;
    });
  };
  b.querySelectorAll('[data-m]').forEach(i=>i.addEventListener('input',updCalc));
  updCalc();
  /* calculadora: se abre apuntando a la última medida que se tocó, y
     arranca con lo que ya haya escrito ahí (así ÷2 ÷4 son un solo toque) */
  let ultMed=MEDIDAS[0][0];
  b.querySelectorAll('[data-m]').forEach(i=>i.addEventListener('focus',()=>{ ultMed=i.dataset.m; }));
  b.querySelector('#fCalc').addEventListener('click',()=>openCalc({
    targets:MEDIDAS.map(([k,l])=>({k,label:l})),
    target:ultMed,
    seed:b.querySelector(`[data-m="${ultMed}"]`)?.value||'',
    onUse(k,val){
      const inp=b.querySelector(`[data-m="${k}"]`);
      if(!inp) return false;
      inp.value=val; sheetDirty=true; updCalc();
      const et=MEDIDAS.find(m=>m[0]===k);
      toast(`${et?et[1]:'Medida'}: ${calcFmt(val)} cm ✓`);
    },
  }));
  /* fotos */
  let photos=(p.photos||[]).slice();
  const phG=b.querySelector('#phG'), phF=b.querySelector('#phF');
  const renderPh=()=>{
    phG.innerHTML=photos.map((d,i)=>`<div class="ph"><img src="${d}" data-pvw="${i}"><button type="button" class="phx" data-px="${i}">✕</button></div>`).join('')
      +(photos.length<4?'<div class="phadd" data-phadd>＋</div>':'');
    phG.querySelectorAll('[data-pvw]').forEach(im=>im.addEventListener('click',()=>photoView(photos[+im.dataset.pvw])));
    phG.querySelectorAll('[data-px]').forEach(x=>x.addEventListener('click',()=>{
      photos.splice(+x.dataset.px,1); sheetDirty=true; renderPh();
    }));
    phG.querySelector('[data-phadd]')?.addEventListener('click',sumarFotos);
  };
  const meterFoto=f=>shrinkImg(f,d=>{
    if(photos.length>=4) return;
    photos.push(d); sheetDirty=true; renderPh();
  });
  /* adentro del APK, la galería del sistema: elige varias de una y las
     entrega convertidas a JPEG (chau HEIC). En la web, el input de siempre. */
  const sumarFotos=()=>{
    const libres=4-photos.length;
    if(libres<=0) return;
    const C=camPlug();
    if(C&&C.pickImages){
      pedirVariasNativas(libres).then(bs=>(bs||[]).forEach(meterFoto)).catch(e=>{
        if(CAM_CANCEL.test(String(e&&e.message||e))) return;
        console.warn('[TEXMA] la galería nativa falló, voy por el selector web:',e);
        phF.click();
      });
      return;
    }
    phF.click();
  };
  renderPh();
  phF.addEventListener('change',()=>{
    [...phF.files].slice(0,4-photos.length).forEach(meterFoto);
    phF.value='';
  });
  b.querySelector('[data-ok]').addEventListener('click',()=>{
    const name=b.querySelector('#fT').value.trim();
    if(!name) return toast('Poné un nombre al proyecto');
    const measures={};
    b.querySelectorAll('[data-m]').forEach(i=>{ if(i.value!=='') measures[i.dataset.m]=i.value; });
    const est=chipsVals(b,'.cEst');
    const data={name,type:segVal(b,'.sTipo'),client:b.querySelector('#fC').value.trim(),
      due:b.querySelector('#fD').value,notes:b.querySelector('#fN').value.trim(),measures,photos,
      price:b.querySelector('#fP').value,deposit:b.querySelector('#fSe').value,
      notions:notions.filter(r=>r.name||r.cost),extras:extras.filter(r=>r.name||r.cost),
      clientMaterial:segVal(b,'.sMat')!=='no',
      arreglos:b.querySelector('#fAr').value,
      paid:est.includes('paid'),delivered:est.includes('delivered'),cancelled:est.includes('cancelled'),
      updated:Date.now()};
    let target=pr;
    if(pr) Object.assign(pr,data);
    else{ target={id:uid(),...data,done:false,created:Date.now()}; S.sewing.unshift(target); }
    if(target.delivered&&!target.deliveredAt) target.deliveredAt=Date.now();
    if(!target.delivered) target.deliveredAt=0;
    syncProjIncome(target);
    save(); closeSheet(); go(cur); toast(pr?'Proyecto actualizado':'Proyecto creado ✂');
  });
  b.querySelector('[data-del]')?.addEventListener('click',()=>borrarProyecto(pr,()=>closeSheet()));
}
/* Eliminar un proyecto de costura, con confirmación. Se lleva también el
   ingreso automático que había generado en Finanzas (si estaba cobrado).
   `antes` corre recién si confirmó: cierra la hoja o el detalle. */
function borrarProyecto(pr,antes){
  dlg({title:'¿Eliminar este proyecto?',
       msg:`«${pr.name||'Sin nombre'}» se borra con sus medidas y fotos. No se puede deshacer.`,
       okTxt:'Eliminar',danger:true},ok=>{
    if(!ok) return;
    S.finance=S.finance.filter(f=>f.projId!==pr.id);
    S.sewing=S.sewing.filter(x=>x.id!==pr.id);
    save();
    if(antes) antes();
    go(cur); toast('Proyecto eliminado');
  });
}
/* cobro de costura → ingreso automático en finanzas */
function syncProjIncome(p){
  const c=projMath(p);
  const idx=S.finance.findIndex(f=>f.projId===p.id);
  if(p.paid&&!p.cancelled&&c.total>0){
    const row={type:'in',amount:c.total,cat:'Costura',date:hoyISO(),desc:p.name+(p.client?' · '+p.client:''),projId:p.id};
    if(idx>=0) S.finance[idx]={...S.finance[idx],...row,date:S.finance[idx].date};
    else S.finance.push({id:uid(),...row});
  }else if(idx>=0) S.finance.splice(idx,1);
}

/* ---- pasatiempos ---- */
/* La categoría no es decorativa: «leer» abre el modo reseña de libros
   (título, autor, desde cuándo, estrellas y la reseña). Se guarda en la
   misma tarjeta del pasatiempo, adentro de \`book\`. */
const HCATS=[['leer','📖 Leer'],['manual','🧵 Manualidades'],['musica','🎵 Música'],
             ['arte','🎨 Arte'],['movimiento','🤸 Movimiento'],['otro','✨ Otro']];
const esLectura=c=>c==='leer';

/* estrellas tocables · devuelve/lee el valor en data-r */
function starsHTML(id,v){
  return `<div class="stars" id="${id}" data-r="${+v||0}">${[1,2,3,4,5].map(i=>
    `<button type="button" class="st ${(+v||0)>=i?'on':''}" data-s="${i}">★</button>`).join('')}<span class="stx"></span></div>`;
}
const STARTXT=['Sin puntuar','No me gustó','Se dejó leer','Está bien','Muy bueno','¡Me encantó!'];
function starsWire(root,sel){
  const box=root.querySelector(sel); if(!box) return;
  const pintar=()=>{
    const v=+box.dataset.r||0;
    box.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',+b.dataset.s<=v));
    box.querySelector('.stx').textContent=STARTXT[v]||'';
  };
  box.querySelectorAll('.st').forEach(b=>b.addEventListener('click',()=>{
    const n=+b.dataset.s;
    box.dataset.r=(+box.dataset.r===n)?0:n;   /* volver a tocar la misma = borrar */
    sheetDirty=true; pintar();
  }));
  pintar();
}
const starsVal=(root,sel)=>+(root.querySelector(sel)?.dataset.r||0);
/* estrellas de solo lectura, para las tarjetas */
const starsRO=v=>`<span class="starsro">${[1,2,3,4,5].map(i=>(+v>=i?'★':'<i>★</i>')).join('')}</span>`;

function hobbyForm(hb){
  const h=hb||{name:'',goal:120,cat:'otro',book:null};
  const bk=h.book||{};
  const b=sheet(hb?'Editar pasatiempo':'Nuevo pasatiempo',`
    <div class="fld"><label>Pasatiempo</label><input id="fT" value="${esc(h.name)}" placeholder="Lectura, bordado…"></div>
    <div class="fld"><label>Categoría</label>
      <div class="chips cCat">${HCATS.map(([v,l])=>
        `<div class="chip ${(h.cat||'otro')===v?'on':''}" data-val="${v}">${l}</div>`).join('')}</div></div>
    <div class="fld"><label>Meta semanal · minutos</label><input id="fG" type="number" inputmode="numeric" min="5" value="${h.goal||120}"></div>
    <div id="fBook" style="display:${esLectura(h.cat)?'':'none'}">
      <div class="lbl" style="margin-top:2px">El libro que estás leyendo</div>
      <div class="fld"><label>Nombre del libro</label><input id="bT" value="${esc(bk.title||'')}" placeholder="Mujercitas, Rayuela…"></div>
      <div class="fld"><label>Autor</label><input id="bA" value="${esc(bk.author||'')}" placeholder="Quién lo escribió"></div>
      <div class="fld"><label>Fecha de inicio</label><input id="bD" type="date" value="${bk.start||''}"></div>
      <div class="fld"><label>Rating</label>${starsHTML('bR',bk.rating)}</div>
      <div class="fld"><label>Reseña</label><textarea id="bV" placeholder="¿Qué te dejó? Escribilo cuando lo termines…">${esc(bk.review||'')}</textarea></div>
    </div>
    <div class="btnrow">${hb?delBtn():''}<button class="btn primary" data-ok>Guardar</button></div>`);
  chipsWire(b,'.cCat',true);
  starsWire(b,'#bR');
  const bookBox=b.querySelector('#fBook');
  const pintarBook=()=>{ bookBox.style.display=esLectura(chipsVals(b,'.cCat')[0])?'':'none'; };
  b.querySelectorAll('.cCat .chip').forEach(c=>c.addEventListener('click',pintarBook));
  /* atajo: si el pasatiempo nuevo se llama «Lectura», «Leer», «Libros»…
     se marca sola la categoría. Solo mientras esté en «Otro»: si la eligió
     a mano no se le toca nada. */
  if(!hb) b.querySelector('#fT').addEventListener('input',ev=>{
    if(chipsVals(b,'.cCat')[0]!=='otro') return;
    if(!/le[ce]r|lectur|libro/i.test(ev.target.value)) return;
    b.querySelectorAll('.cCat .chip').forEach(c=>c.classList.toggle('on',c.dataset.val==='leer'));
    pintarBook();
  });
  b.querySelector('[data-ok]').addEventListener('click',()=>{
    const name=b.querySelector('#fT').value.trim();
    if(!name) return toast('Falta el nombre');
    const cat=chipsVals(b,'.cCat')[0]||'otro';
    const data={name,goal:Math.max(5,+b.querySelector('#fG').value||60),cat};
    if(esLectura(cat)){
      const libro={
        title:b.querySelector('#bT').value.trim(),
        author:b.querySelector('#bA').value.trim(),
        start:b.querySelector('#bD').value,
        rating:starsVal(b,'#bR'),
        review:b.querySelector('#bV').value.trim(),
      };
      /* si no cargó nada del libro, no ensuciamos la tarjeta con un objeto vacío */
      data.book=(libro.title||libro.author||libro.start||libro.rating||libro.review)?libro:null;
    } else if(hb&&hb.book) data.book=hb.book;   /* cambió de categoría: la reseña NO se tira */
    if(hb) Object.assign(hb,data); else S.hobbies.push({id:uid(),...data});
    save(); closeSheet(); go(cur); toast('Pasatiempo guardado ✓');
  });
  b.querySelector('[data-del]')?.addEventListener('click',()=>{
    S.hobbies=S.hobbies.filter(x=>x.id!==hb.id);
    S.hobbyLogs=S.hobbyLogs.filter(l=>l.hobbyId!==hb.id);
    save(); closeSheet(); go(cur); toast('Pasatiempo eliminado');
  });
}

function recInterval(r){ // días entre pagos en modo clases
  return Math.max(1,Math.round((+r.n||1)/Math.max(1,+r.perWeek||1)*7));
}
function recAdvance(dISO,r){
  const d=pDate(dISO);
  if(r.mode==='clases') d.setDate(d.getDate()+recInterval(r));
  else if(r.unit==='m') d.setMonth(d.getMonth()+(+r.n||1));
  else d.setDate(d.getDate()+(+r.n||1)*(r.unit==='w'?7:1));
  return iso(d);
}

function syncShopExpense(i){

  if(i.done&&amt>0){
    const row={type:'out',amount:amt,cat:SHOP2FIN[i.cat]||(catsFor('out').includes(i.cat)?i.cat:'Otro'),
      date:i.boughtDate||hoyISO(),desc:i.name,shopId:i.id};
    if(idx>=0) S.finance[idx]={...S.finance[idx],...row};
    else S.finance.push({id:uid(),...row});
  }else if(idx>=0) S.finance.splice(idx,1);

function logPrice(i){
  const amt=+i.price||0; if(!amt) return;
  const d=i.boughtDate||hoyISO();
  const k=i.name.trim().toLowerCase();
  const same=S.priceBook.find(p=>p.name.toLowerCase()===k&&p.date===d);
  if(same){ same.price=amt; same.cat=i.cat; return; }
  S.priceBook.push({id:uid(),name:i.name.trim(),cat:i.cat||'Otro',price:amt,date:d});
  if(S.priceBook.length>600) S.priceBook.splice(0,S.priceBook.length-600);
}

/* ¿el medicamento está activo ese día? (ventana del tratamiento) */
function medActiveOn(m,dISO){
  if(m.start&&dISO<m.start) return false;
  if(m.start&&m.durationDays>0){
    const end=iso(new Date(pDate(m.start).getTime()+(m.durationDays-1)*864e5));
    if(dISO>end) return false;
  }
  return true;
}
/* ¿ese día tocaba tomarlo? (ventana + días de la semana) */
function medSchedOn(m,d){
  return medActiveOn(m,iso(d))&&(!(m.days&&m.days.length)||m.days.includes(d.getDay()));
}
/* racha: días seguidos con TODAS las tomas hechas.
   Hoy incompleto no corta (todavía puede completarse);
   días no programados tampoco cortan. Todo derivado de medLog. */
function medStreak(m){
  let n=0; const d=new Date(), today=hoyISO();
  for(let i=0;i<730;i++){
    const dI=iso(d);
    if(m.start&&dI<m.start) break;
    if(medSchedOn(m,d)){
      const log=S.medLog[dI]||{};
      const full=(m.times||[]).length>0&&m.times.every(t=>log[m.id+'_'+t]);
      if(full) n++;
      else if(dI!==today) break;
    }
    d.setDate(d.getDate()-1);
  }
  return n;
}
/* mini calendario: últimos 14 días */
function medCalHTML(m){
  const today=hoyISO(); let out='';
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dI=iso(d);
    if(!medSchedOn(m,d)){ out+='<i class="off"></i>'; continue; }
    const log=S.medLog[dI]||{};
    const full=(m.times||[]).length>0&&m.times.every(t=>log[m.id+'_'+t]);
    out+=`<i class="${full?'on':''}${dI===today?' hoy':''}"></i>`;
  }
  return `<div class="medcal">${out}</div>`;
}
/* etiqueta del tratamiento: "día 3 de 10", "crónico", etc. */
function medTrat(m){
  const hoy=hoyISO();
  if(!(m.durationDays>0)) return m.start&&m.start>hoy?'empieza '+fShort(m.start):'crónico';
  const start=m.start||hoy;
  const end=iso(new Date(pDate(start).getTime()+(m.durationDays-1)*864e5));
  if(hoy<start) return `empieza ${fShort(start)} · ${m.durationDays} días`;
  if(hoy>end) return 'tratamiento terminado ✓';
  const dia=Math.floor((pDate(hoy)-pDate(start))/864e5)+1;
  return `día ${dia} de ${m.durationDays}`;
}
function medsToday(){
  const d=new Date(), today=hoyISO();
  const log=S.medLog[today]||{};
  const rows=[];
  S.meds.forEach(m=>{
    if(!medSchedOn(m,d)) return;
    (m.times||[]).forEach(t=>rows.push({m,t,on:!!log[m.id+'_'+t]}));
  });
  rows.sort((a,b)=>a.t.localeCompare(b.t));
  return rows;
}
/* animación al marcar una toma: pastilla que cae + tilde dibujado + onda */
function pillAnim(cb){
  const g=G(); if(!g) return;
  const r=cb.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const p=document.createElement('div'); p.textContent='💊';
  p.style.cssText=`position:fixed;left:${cx}px;top:${r.top}px;z-index:999;font-size:21px;pointer-events:none;transform:translate(-50%,-50%)`;
  document.body.appendChild(p);
  g.timeline({onComplete:()=>p.remove()})
    .fromTo(p,{y:-34,opacity:0,rotation:-100},{y:-6,opacity:1,rotation:0,duration:.3,ease:'power2.in'})
    .to(p,{y:10,scale:.3,opacity:0,duration:.28,ease:'back.in(1.7)'});
  const ring=document.createElement('div');
  ring.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:${r.width}px;height:${r.height}px;border:2px solid var(--deep);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:998`;
  document.body.appendChild(ring);
  g.fromTo(ring,{scale:1,opacity:.75},{scale:2.3,opacity:0,duration:.55,delay:.22,ease:'power2.out',onComplete:()=>ring.remove()});
  g.fromTo(cb,{scale:.55},{scale:1,duration:.55,delay:.2,ease:'elastic.out(1,.45)'});
  const path=cb.querySelector('path');
  if(path&&path.getTotalLength){
    const len=path.getTotalLength();
    g.fromTo(path,{strokeDasharray:len,strokeDashoffset:len},
      {strokeDashoffset:0,duration:.35,delay:.25,ease:'power2.out',
       clearProps:'strokeDasharray,strokeDashoffset'});
  }
}
function medRows(rows){
  return rows.map(({m,t,on})=>`<div class="item ${on?'done':''}">
    <div class="cb ${on?'on':''}" data-med="${m.id}_${t}">${CHECK}</div>
    <div class="grow" data-edit-med="${m.id}" style="cursor:pointer">
      <div class="t">${esc(m.name)}${m.dose?` <span class="muted small">· ${esc(m.dose)}</span>`:''}</div>
      ${m.notes?`<div class="s">${esc(m.notes)}</div>`:''}
    </div><span class="pill">${t}</span>
  </div>`).join('');
}
function wireMeds(root){
  root.querySelectorAll('[data-med]').forEach(cb=>cb.addEventListener('click',()=>{
    const today=hoyISO(); S.medLog[today]=S.medLog[today]||{};
    const k=cb.dataset.med;
    const on=S.medLog[today][k]=!S.medLog[today][k]; save();
    cb.classList.toggle('on');
    cb.closest('.item').classList.toggle('done');
    if(!on){ popCB(cb); return; }
    pillAnim(cb);
    /* si con esta toma completó el día, festejamos la racha */
    const m=S.meds.find(x=>x.id===k.split('_')[0]);
    if(m){
      const log=S.medLog[today];
      const full=(m.times||[]).every(t=>log[m.id+'_'+t]);
      if(full){
        const n=medStreak(m);
        toast(n>1?`¡Toma completa! Racha: ${n} días seguidos 🔥`:'¡Toma completa por hoy! ✓');
      }
    }
  }));
  root.querySelectorAll('[data-edit-med]').forEach(r=>r.addEventListener('click',()=>{
    const m=S.meds.find(x=>x.id===r.dataset.editMed); if(m) medForm(m);
  }));
}

/* ---------- CALENDARIO ---------- */
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=hoyISO();
VIEWS.cal={
  fab(){ eventForm(null,calSel); },
  render(){
    const today=hoyISO(), nDays=new Date(calY,calM+1,0).getDate();
    const byDate={};
    S.events.forEach(e=>{
      let d=pDate(e.date); const lim=pDate(evEnd(e)); let i=0;
      while(d<=lim&&i<62){ const ds=iso(d); (byDate[ds]=byDate[ds]||[]).push(e); d.setDate(d.getDate()+1); i++; }
    });
    const recBy={},payBy={};
    S.recurring.forEach(r=>{
      (recBy[r.nextDue]=recBy[r.nextDue]||[]).push(r);
      if(r.lastPaid) (payBy[r.lastPaid]=payBy[r.lastPaid]||[]).push(r);
    });
    /* dos vistas del mismo mes: tira horizontal (semana) o grilla completa (mes) */
    const vista=S.settings.calVista==='mes'?'mes':'semana';
    const nEv=ds=>(byDate[ds]||[]).length+(recBy[ds]||[]).length+(payBy[ds]||[]).length;
    const strip=[...Array(nDays)].map((_,i)=>{
      const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
      const d=pDate(ds), n=nEv(ds);
      return `<div class="dayc ${ds===calSel?'on':''} ${ds===today?'today':''}" data-day="${ds}">
        <em>${DIA[d.getDay()].slice(0,3)}</em><b>${i+1}</b>
        <div class="dts">${'<i></i>'.repeat(Math.min(n,3))}</div></div>`;
    }).join('');
    let grid='';
    if(vista==='mes'){
      const off=(new Date(calY,calM,1).getDay()+6)%7;
      let cells='';
      for(let i=0;i<off;i++) cells+='<div class="cald off"></div>';
      for(let d=1;d<=nDays;d++){
        const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells+=`<div class="cald ${ds===today?'today':''} ${ds===calSel?'sel':''}" data-day="${ds}">
          ${d}<div class="dts">${'<i></i>'.repeat(Math.min(nEv(ds),3))}</div></div>`;
      }
      grid=`<div class="calgrid">${DL.map(l=>`<div class="caldow">${l}</div>`).join('')}${cells}</div>`;
    }
    const selEvs=(byDate[calSel]||[]).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const selRecs=recBy[calSel]||[], selPays=payBy[calSel]||[];
    const TCOL={cita:'#E5407A',evento:'#F2803C',recordatorio:'#8B6CD9'};
    const TNAME={cita:'Cita',evento:'Evento',recordatorio:'Recordatorio'};
    const evCard=e=>`<div class="evcard" data-ev="${e.id}" style="--c:${TCOL[e.type]||'#F2803C'}">
      <div class="ehora">${e.time?esc(e.time)+(e.timeEnd?'<br>'+esc(e.timeEnd):''):'todo<br>el día'}</div>
      <div class="grow"><div class="et">${esc(e.title)}</div>
        <div class="es">${[TNAME[e.type]||'Evento',e.place?esc(e.place):'',evEnd(e)!==e.date?'hasta '+fShort(evEnd(e)):''].filter(Boolean).join(' · ')}</div>
        ${e.notes?`<div class="es">${esc(e.notes)}</div>`:''}</div>
    </div>`;
    const recCard=(r,paid)=>`<div class="evcard" data-recr="${r.id}" style="--c:${paid?'#2F9E6B':'#C08A3C'}">
      <div class="ehora">pago</div>
      <div class="grow"><div class="et">${esc(r.name)}</div>
        <div class="es">${fMoney(r.amount,r.currency)}${r.currency==='USD'?' ≈ '+fMoney(toARS(r.amount,'USD')):''}</div></div>
      <span class="pill ${paid?'ok':'warn'}">${paid?'Pagado ✓':'Falta pagar'}</span>
    </div>`;
    const upEv=S.events.filter(e=>evEnd(e)>=today).map(e=>({d:e.date+(e.time||''),h:eventRow(e,true)}));
    const upRec=S.recurring.map(r=>({d:r.nextDue,h:recRow(r,true)}));
    const prox=[...upEv,...upRec].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,8);
    V.innerHTML=`
      <div class="vc aghead">
        <h1 class="vt">Agenda</h1>
        <div class="seg calseg">
          <button data-cv="semana" class="${vista==='semana'?'on':''}">Semana</button>
          <button data-cv="mes" class="${vista==='mes'?'on':''}">Mes</button>
        </div>
      </div>
      <div class="${vista==='mes'?'card ':''}vc">
        <div class="calhead" style="margin-bottom:8px">
          <button data-nav="-1">‹</button>
          <div class="m">${MES[calM]} ${calY}</div>
          <button data-nav="1">›</button>
        </div>
        ${vista==='mes'?grid:`<div class="daystrip" id="dstrip">${strip}</div>`}
      </div>
      <div class="vc">
        <div class="lbl" style="margin:6px 2px 10px">${fLong(calSel)}</div>
        ${selEvs.length||selRecs.length||selPays.length
          ? selEvs.map(evCard).join('')+selRecs.map(r=>recCard(r,false)).join('')+selPays.map(r=>recCard(r,true)).join('')
          : '<div class="card"><div class="empty">Sin eventos este día — tocá + para agendar</div></div>'}
      </div>
      <div class="card vc"><div class="lbl">Próximos</div>
        ${prox.length?prox.map(x=>x.h).join(''):'<div class="empty">Nada agendado por venir</div>'}
      </div>`;
    /* dejar el día elegido centrado en la tira, sin animación al entrar */
    const st=V.querySelector('#dstrip');
    if(st){
      const on=st.querySelector('.dayc.on')||st.querySelector('.dayc.today');
      if(on) st.scrollLeft=(on.offsetLeft-st.offsetLeft)-st.clientWidth/2+on.clientWidth/2;
    }
    V.querySelectorAll('[data-cv]').forEach(b=>b.addEventListener('click',()=>{
      if(S.settings.calVista===b.dataset.cv) return;
      S.settings.calVista=b.dataset.cv; save();
      VIEWS.cal.render(); entra();
    }));
    V.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
      calM+=+b.dataset.nav;
      if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;}
      /* si el día elegido quedó en otro mes, selecciona el 1 (u hoy, si es este mes) */
      const mk=`${calY}-${String(calM+1).padStart(2,'0')}`;
      if(!calSel.startsWith(mk)) calSel=hoyISO().startsWith(mk)?hoyISO():`${mk}-01`;
      VIEWS.cal.render(); entra();
    }));
    V.querySelectorAll('[data-day]').forEach(c=>c.addEventListener('click',()=>{
      calSel=c.dataset.day; VIEWS.cal.render();
    }));
    wireEvents(V); wireRecs(V);
  }
};

/* ---------- COSTURA ---------- */
const dAgo=ts=>Math.floor((Date.now()-ts)/864e5);
function hace(ts){
  if(!ts) return '';
  const d=dAgo(ts);
  return d<=0?'hoy':d===1?'ayer':d<30?`hace ${d} días`:d<60?'hace un mes':`hace ${Math.floor(d/30)} meses`;
}
let sewCli=false;
VIEWS.costura={
  fab(){ projForm(); },
  render(){
    const act=S.sewing.filter(p=>!p.cancelled);
    const pend=act.filter(p=>!p.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
    const sinRet=act.filter(p=>p.done&&!p.delivered).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
    const cerr=S.sewing.filter(p=>p.cancelled||(p.done&&p.delivered)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    const TIPO={vestido:'vestido',prenda:'prenda',arreglo:'arreglo',otro:'otro'};
    const porCobrar=act.filter(p=>!p.paid).reduce((s,p)=>s+projMath(p).saldo,0);
    const cobrado=act.filter(p=>p.paid).reduce((s,p)=>s+projMath(p).total,0);
    const aviosT=act.reduce((s,p)=>s+projMath(p).avios,0);
    /* fila estilo iOS: miniatura · título y datos · check de terminado */
    const row=p=>{
      const late=p.due&&!p.done&&p.due<hoyISO();
      const c=projMath(p);
      const espera=p.done&&!p.delivered?dAgo(p.doneAt||Date.now()):0;
      const foto=fotoPortada(p);
      const linea=p.done
        ? (p.delivered?'entregado '+hace(p.deliveredAt):`sin retirar · ${espera} día${espera===1?'':'s'}`)
        : (p.due?(late?'venció ':'entrega ')+fShort(p.due):'sin fecha de entrega');
      return `<div class="prow ${p.done?'done':''}" data-pd="${p.id}">
        <div class="pth">${foto?`<img src="${foto}" alt="" loading="lazy">`:`<svg viewBox="0 0 24 24">${MICONS.costura}</svg>`}</div>
        <div class="grow">
          <div class="t">${esc(p.name)}</div>
          <div class="s ${late?'late':''}">${[TIPO[p.type]||p.type,p.client,linea].filter(Boolean).map(esc).join(' · ')}</div>
          <div class="stt">
            ${c.total?`<span class="${p.paid?'ok':''}">${p.paid?'pagado':'saldo '+fMoney(c.saldo)}</span>`:''}
            ${p.done?`<span class="${p.delivered?'ok':(espera>7?'al':'')}">${p.delivered?'entregado':'sin retirar'}</span>`:''}
            ${p.cancelled?'<span class="al">cancelado</span>':''}
            ${+p.arreglos?`<span>${p.arreglos} arreglo${+p.arreglos===1?'':'s'}</span>`:''}
          </div>
        </div>
        <div class="cb ${p.done?'on':''}" data-cbp="${p.id}" aria-label="Terminado">${CHECK}</div>
      </div>`;
    };
    /* resumen por cliente */
    const cli={};
    S.sewing.forEach(p=>{
      const n=(p.client||'').trim()||'Sin cliente';
      const c=cli[n]=cli[n]||{n,trabajos:0,arreglos:0,cobrado:0,saldo:0};
      c.trabajos++;
      /* si no cargó un número y el trabajo ES un arreglo, cuenta como uno */
      c.arreglos+=(+p.arreglos||0)||(p.type==='arreglo'?1:0);
      const m=projMath(p);
      if(p.paid&&!p.cancelled) c.cobrado+=m.total; else if(!p.cancelled) c.saldo+=m.saldo;
    });
    const cliRows=Object.values(cli).sort((a,b)=>b.arreglos-a.arreglos||b.trabajos-a.trabajos);
    V.innerHTML=`
      <h1 class="vt vc">Costura</h1>
      <div class="card vc">
        <div class="lbl">Por cobrar</div>
        <div class="balance">${fMoney(porCobrar)}</div>
        <div class="kpi">
          <div><div class="kl">Cobrado</div><div class="kv">${fMoney(cobrado)}</div></div>
          <div><div class="kl">Avíos gastados</div><div class="kv">${fMoney(aviosT)}</div></div>
        </div>
      </div>
      <div class="lbl" style="margin-top:4px">En curso · ${pend.length}</div>
      <div class="card plist vc">
        ${pend.length?pend.map(row).join(''):`<div class="empty">Sin proyectos — tocá + para empezar uno ✂</div>`}
      </div>
      ${sinRet.length?`<div class="lbl">Terminados sin retirar · ${sinRet.length}</div>
        <div class="card plist vc">${sinRet.map(row).join('')}</div>`:''}
      ${cliRows.length?`<div class="card vc fold ${sewCli?'open':''}" id="cliF">
        <div class="fh"><span class="fx">›</span><div class="grow"><div class="t">Clientes</div>
          <div class="s">${cliRows.length} · trabajos y arreglos pedidos</div></div></div>
        <div class="fb">${cliRows.map(c=>`<div class="item">
          <div class="grow"><div class="t" style="font-weight:600">${esc(c.n)}</div>
          <div class="s">${c.trabajos} trabajo${c.trabajos===1?'':'s'} · ${c.arreglos} arreglo${c.arreglos===1?'':'s'}</div></div>
          <span class="mono" style="font-size:12px">${c.saldo?'debe '+fMoney(c.saldo):fMoney(c.cobrado)}</span>
        </div>`).join('')}</div>
      </div>`:''}
      ${cerr.length?`<div class="lbl">Cerrados · ${cerr.length}</div><div class="card plist vc">${cerr.map(row).join('')}</div>`:''}
      <div class="card vc" style="text-align:center;padding:20px">
        ${maniqui()}
        <div class="lbl" style="margin-top:8px;text-align:center">Cada proyecto guarda sus medidas · en cm</div>
      </div>`;
    V.querySelectorAll('[data-cbp]').forEach(cb=>cb.addEventListener('click',ev=>{
      ev.stopPropagation();                      /* el check no abre el detalle */
      const p=S.sewing.find(x=>x.id===cb.dataset.cbp); if(!p) return;
      p.done=!p.done;
      p.doneAt=p.done?Date.now():0;
      if(!p.done){ p.delivered=false; p.deliveredAt=0; }
      save();
      cb.classList.toggle('on',p.done); popCB(cb);
      if(p.done){
        const r=cb.getBoundingClientRect();
        hearts(r.left+r.width/2,r.top);
        toast('¡Proyecto terminado! ✂ ♥');
      }
      setTimeout(()=>go(cur),650);
    }));
    V.querySelectorAll('[data-pd]').forEach(r=>r.addEventListener('click',()=>{
      const p=S.sewing.find(x=>x.id===r.dataset.pd); if(p) projDetail(p);
    }));
    const cf=V.querySelector('#cliF');
    cf?.querySelector('.fh').addEventListener('click',()=>{ sewCli=!sewCli; cf.classList.toggle('open',sewCli); });
    calcFab(true);
  }
};

/* ============================================================
   COSTURA · DETALLE INMERSIVO
   ------------------------------------------------------------
   Pantalla completa arriba de la vista (#pdet, z 46: tapa el nav y los
   botones flotantes, pero queda DEBAJO de la hoja de edición y de los
   diálogos, así «Editar» abre el formulario encima y al guardar se ve
   el detalle actualizado). Entra al historial: el «atrás» del celu lo
   cierra. go() lo refresca si se re-dibuja la misma vista y lo cierra
   si se cambia de sección.
============================================================ */
function projDetail(p){
  let w=document.getElementById('pdet');
  if(!w){
    w=document.createElement('div'); w.id='pdet';
    document.body.appendChild(w);
    document.body.classList.add('pdet-on');
    try{ history.pushState({pd:1,v:cur},''); }catch(e){}
    const g=G(); if(g) g.fromTo(w,{opacity:0,y:24},{opacity:1,y:0,duration:.32,ease:'power2.out',clearProps:'transform'});
  }
  w.dataset.id=p.id;
  pintarDetalle(w,p);
}
function projDetailRefresh(){
  const w=document.getElementById('pdet'); if(!w) return;
  const p=S.sewing.find(x=>x.id===w.dataset.id);
  if(p) pintarDetalle(w,p); else cerrarDetalle(true);
}
/* sinHist=true: se cierra desde código (el historial ya se movió o no importa) */
function cerrarDetalle(sinHist){
  const w=document.getElementById('pdet'); if(!w) return;
  w.remove(); document.body.classList.remove('pdet-on');
  if(!sinHist&&history.state&&history.state.pd){ histSuppress++; try{ history.back(); }catch(e){} }
}
function pintarDetalle(w,p){
  const fotos=(Array.isArray(p.photos)?p.photos:[]).map(f=>typeof f==='string'?f:(f&&(f.data||f.src))).filter(Boolean);
  const c=projMath(p);
  const late=p.due&&!p.done&&p.due<hoyISO();
  const TIPO={vestido:'Vestido',prenda:'Prenda',arreglo:'Arreglo',otro:'Otro'};
  const med=MEDIDAS.filter(([k])=>(p.measures||{})[k]!==undefined&&(p.measures||{})[k]!=='');
  const estado=p.cancelled?['al','cancelado']:p.delivered?['ok','entregado']:p.done?['ac','terminado · sin retirar']:['ac','en curso'];
  w.innerHTML=`<div class="pdw">
    <div class="pdhero">
      ${fotos.length?`<div class="pdimgs">${fotos.map((f,i)=>`<img src="${f}" alt="" data-pdi="${i}">`).join('')}</div>`
        :`<div class="pdph"><svg viewBox="0 0 24 24">${MICONS.costura}</svg></div>`}
      <button class="pdback" data-pdx aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      ${fotos.length>1?`<span class="pdcount" id="pdN">1 / ${fotos.length}</span>`:''}
    </div>
    <div class="pdbody">
      <div class="pdk">${esc(TIPO[p.type]||p.type||'Proyecto')}${p.client?' · '+esc(p.client):''}</div>
      <h1 class="pdt">${esc(p.name||'Sin nombre')}</h1>
      <div class="pdtags">
        <span class="pdtag ${estado[0]}">${estado[1]}</span>
        ${p.due?`<span class="pdtag ${late?'al':''}">${late?'venció ':'entrega '}${fShort(p.due)}</span>`:''}
        ${c.total?`<span class="pdtag ${p.paid?'ok':''}">${p.paid?'pagado':'saldo '+fMoney(c.saldo)}</span>`:''}
        ${+p.arreglos?`<span class="pdtag">${p.arreglos} arreglo${+p.arreglos===1?'':'s'}</span>`:''}
        ${fotos.length?`<span class="pdtag">${fotos.length} foto${fotos.length===1?'':'s'}</span>`:''}
      </div>
      <div class="pdacts">
        <button class="btn primary" data-pda="ed">✎ Editar</button>
        ${p.cancelled?'':`<button class="btn" data-pda="done">${p.done?'↺ Reabrir':'✓ Terminado'}</button>`}
        ${p.done&&!p.cancelled?`<button class="btn full" data-pda="dlv">${p.delivered?'Marcar sin retirar':'📦 Entregado'}</button>`:''}
      </div>
      <div class="pdsec">
        <div class="lbl">Medidas · cm</div>
        ${med.length?`<div class="pdmed">${med.map(([k,l])=>`<div><em>${l}</em><b>${esc(p.measures[k])}<small>cm</small></b></div>`).join('')}</div>`
          :'<div class="empty" style="padding:8px 0">Sin medidas cargadas</div>'}
      </div>
      ${c.total||c.avios?`<div class="pdsec">
        <div class="lbl">Presupuesto</div>
        <div class="pdrow"><span>Trabajo</span><b>${fMoney(c.price)}</b></div>
        ${c.extras?`<div class="pdrow"><span>Materiales</span><b>${fMoney(c.extras)}</b></div>`:''}
        ${c.dep?`<div class="pdrow"><span>Seña</span><b>− ${fMoney(c.dep)}</b></div>`:''}
        <div class="pdrow tot"><span>${p.paid?'Cobrado':'Saldo'}</span><b>${fMoney(p.paid?c.total:c.saldo)}</b></div>
        ${c.avios?`<div class="pdrow"><span>Avíos gastados</span><b>${fMoney(c.avios)}</b></div>
        <div class="pdrow"><span>Ganancia</span><b>${fMoney(c.gan)}</b></div>`:''}
      </div>`:''}
      ${p.notes?`<div class="pdsec"><div class="lbl">Notas</div><div class="pdnotes">${esc(p.notes)}</div></div>`:''}
      <button class="btn danger pddel" data-pda="del">🗑️ Eliminar proyecto</button>
    </div>
  </div>`;
  w.querySelector('[data-pdx]').addEventListener('click',()=>cerrarDetalle());
  w.querySelectorAll('[data-pdi]').forEach(im=>im.addEventListener('click',()=>photoView(fotos[+im.dataset.pdi])));
  const tira=w.querySelector('.pdimgs'), n=w.querySelector('#pdN');
  if(tira&&n) tira.addEventListener('scroll',()=>{
    n.textContent=`${Math.round(tira.scrollLeft/tira.clientWidth)+1} / ${fotos.length}`;
  },{passive:true});
  w.querySelector('[data-pda="ed"]').addEventListener('click',()=>projForm(p));
  /* al confirmar, se cierra el detalle (con su paso en el historial) y se re-dibuja la lista */
  w.querySelector('[data-pda="del"]').addEventListener('click',()=>borrarProyecto(p,()=>cerrarDetalle()));
  w.querySelector('[data-pda="done"]')?.addEventListener('click',()=>{
    p.done=!p.done; p.doneAt=p.done?Date.now():0;
    if(!p.done){ p.delivered=false; p.deliveredAt=0; }
    save(); go(cur);
    toast(p.done?'¡Proyecto terminado! ✂ ♥':'Proyecto reabierto');
  });
  w.querySelector('[data-pda="dlv"]')?.addEventListener('click',()=>{
    p.delivered=!p.delivered; p.deliveredAt=p.delivered?Date.now():0;
    save(); go(cur);
    toast(p.delivered?'Entregado ✓':'Marcado sin retirar');
  });
}

/* el botón flotante de la calculadora solo existe en Costura. Va aparte de
   #addfab (que ahí crea proyectos) y se borra al salir de la sección. */
function calcFab(mostrar){
  const v=document.getElementById('calcfab');
  if(!mostrar){ if(v) v.remove(); return; }
  if(v) return;
  const bt=document.createElement('button');
  bt.id='calcfab'; bt.type='button'; bt.textContent='🧮';
  bt.setAttribute('aria-label','Calculadora de medidas');
  bt.addEventListener('click',()=>openCalc({}));
  document.body.appendChild(bt);
}

/* un día cuenta si hay sesión anotada o si tildó algún ejercicio de la rutina */
function trainedOn(ds){
  return S.trainLogs.some(l=>l.date===ds)||S.workoutLogs.some(l=>l.date===ds&&(l.done||[]).length);
}
function streakCalc(){
  const d=new Date(); let cur=0;
  if(!trainedOn(iso(d))) d.setDate(d.getDate()-1); /* el día de hoy todavía se puede salvar */
  while(trainedOn(iso(d))&&cur<3650){ cur++; d.setDate(d.getDate()-1); }
  /* mejor racha histórica */
  const days=[...new Set([...S.trainLogs.map(l=>l.date),
    ...S.workoutLogs.filter(l=>(l.done||[]).length).map(l=>l.date)])].sort();
  let best=0,run=0,prev=null;
  days.forEach(ds=>{
    if(prev){ const df=Math.round((pDate(ds)-pDate(prev))/864e5); run=df===1?run+1:1; }
    else run=1;
    best=Math.max(best,run); prev=ds;
  });
  return {cur,best:Math.max(best,cur),total:days.length,days};
}

function rachaCompletar(){
  const today=hoyISO();
  if(trainedOn(today)) return;
  const antes=streakCalc().cur;
  S.trainLogs.push({id:uid(),date:today,title:'Completado',minutes:0,note:''});

  if(!fl) return;

  if(window.scrollY>60) window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
  if(g){
    g.fromTo(fl.querySelector('svg'),{scale:1,rotation:0},{keyframes:[{scale:1.25,rotation:-5,duration:.18,ease:'power2.out'},{scale:1,rotation:0,duration:.6,ease:'elastic.out(1.2,.35)'}],transformOrigin:'50% 85%',delay:.12});

    g.fromTo('#rGo',{scale:.96},{scale:1,duration:.4,ease:'back.out(3)'});

/* ---- nutrición: Harris-Benedict (revisada) + reparto 25/30/45 + agua 35 ml/kg ---- */
function fitGoals(){
  const f=S.settings.fit||{};
  const w=+f.weight||0, h=+f.height||0, a=+f.age||0;
  if(!w||!h||!a) return null;
  const bmr=f.sex==='m'
    ? 88.362+13.397*w+4.799*h-5.677*a
    : 447.593+9.247*w+3.098*h-4.330*a;
  const kcal=Math.round(bmr*1.375/10)*10;   /* basal × actividad ligera */
  return {kcal,
    prot:Math.round(kcal*.25/4),   /* 25% en proteína, 4 kcal/g */
    fat:Math.round(kcal*.30/9),    /* 30% en grasas, 9 kcal/g   */
    carb:Math.round(kcal*.45/4),   /* 45% en carbos, 4 kcal/g   */
    aguaMl:Math.round(w*35), vasos:Math.max(1,Math.ceil(w*35/250))};
}

/* ============================================================
   INVERSIONES
   ------------------------------------------------------------
   Sección APARTE de Finanzas, a propósito: los aportes de una meta
   viven en S.investments y NO tocan S.finance ni el balance del mes.
   Son dos cuentas distintas y ninguna mira a la otra.
   Cada meta es visual: lleva su foto (la casa, el auto, el viaje) y
   arriba de todo va el banner de imagen de la sección.
============================================================ */
function invMath(m){
  const meta=+m.goal||0;
  const puesto=(m.hist||[]).reduce((a,h)=>a+(+h.amount||0),0);
  const pct=meta>0?Math.min(100,Math.round(puesto/meta*100)):0;
  return {meta,puesto,pct,falta:Math.max(0,meta-puesto),listo:meta>0&&puesto>=meta};
}
const invWho=id=>(S.settings.invMembers||[]).find(p=>p.id===id);
/* cuánto puso cada persona en una meta. Aportes viejos (who:'') = "Juntos",
   en gris neutro y abajo del frasco. El % va sobre la meta, capado a 100. */
function invSplit(m){
  const c=invMath(m); if(c.meta<=0) return [];
  const por={};
  (m.hist||[]).forEach(h=>{ const k=h.who||''; por[k]=(por[k]||0)+(+h.amount||0); });
  const out=[];
  if(por['']>0) out.push({id:'',name:'Juntos',color:'#B9AE9E',amount:por['']});
  (S.settings.invMembers||[]).forEach(p=>{
    if(por[p.id]>0) out.push({id:p.id,name:p.name,color:p.color,amount:por[p.id]});
  });
  let acc=0;
  out.forEach(p=>{ p.pct=Math.max(0,Math.min(100-acc,p.amount/c.meta*100)); acc+=p.pct; });
  return out;
}
/* frasco SVG: capas de líquido por persona + onda arriba.
   Las capas arrancan vacías; animJars() las sube con GSAP. */
function frascoSVG(m,W){
  const c=invMath(m), split=invSplit(m);
  const sw=W||56, sh=Math.round(sw*92/64);
  const X=13,WW=38,BOT=86,TOP=12,AREA=BOT-TOP;
  let acc=0;
  const caps=split.map(p=>{
    const h=AREA*p.pct/100, y=BOT-acc-h; acc+=h;
    return `<rect class="jarL" x="${X}" width="${WW}" y="${BOT}" height="0" data-y="${y.toFixed(1)}" data-h="${h.toFixed(1)}" fill="${p.color}" opacity=".82"/>`;
  }).join('');
  const topY=BOT-acc, topCol=split.length?split[split.length-1].color:'var(--deep)';
  const wave=acc>0?`<path class="jarW" data-ty="${topY.toFixed(1)}" fill="${topCol}" opacity=".45"
    d="M-24 0 q8 -3.5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 v9 h-136 z"/>`:'';
  return `<svg width="${sw}" height="${sh}" viewBox="0 0 64 92" aria-hidden="true">
    <defs><clipPath id="jc${m.id}"><rect x="${X}" y="${TOP}" width="${WW}" height="${AREA}" rx="9"/></clipPath></defs>
    <g clip-path="url(#jc${m.id})">${caps}${wave}</g>
    <rect x="11" y="10" width="42" height="78" rx="11" fill="none" stroke="var(--line)" stroke-width="2.5"/>
    <rect x="22" y="2" width="20" height="9" rx="3.5" fill="none" stroke="var(--line)" stroke-width="2.5"/>
    <text x="32" y="54" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)" font-family="inherit">${c.pct}%</text>
  </svg>`;
}
let jarTweens=[];
function animJars(root){
  const g=G();
  if(g){ jarTweens.forEach(t=>t.kill()); jarTweens=[]; }
  root.querySelectorAll('.jarL').forEach(r=>{
    const y=+r.dataset.y, h=+r.dataset.h;
    if(g) jarTweens.push(g.to(r,{attr:{y,height:h},duration:1,ease:'power2.out',delay:.15}));
    else { r.setAttribute('y',y); r.setAttribute('height',h); }
  });
  root.querySelectorAll('.jarW').forEach(w=>{
    const ty=+w.dataset.ty;
    if(g){
      jarTweens.push(g.fromTo(w,{y:86},{y:ty,duration:1,ease:'power2.out',delay:.15}));
      jarTweens.push(g.to(w,{x:-14,duration:2.2,ease:'sine.inOut',repeat:-1,yoyo:true}));
    } else w.setAttribute('transform',`translate(0 ${ty})`);
  });
}
/* pedir una imagen sin dejar un <input file> colgado en el HTML */
/* ============================================================
   PEDIR UNA FOTO
   ------------------------------------------------------------
   Adentro del APK va por @capacitor/camera: abre la cámara o la galería
   del sistema y Android nos devuelve SIEMPRE un JPEG en base64, sea cual
   sea el formato del archivo original. Ese es el arreglo de los HEIC:
   la conversión la hace el decodificador del sistema operativo, que sí
   sabe leerlos, y a la WebView le llega algo que entiende siempre.
   Encima resuelve la rotación (correctOrientation) y achica de entrada,
   así el celular no tiene que decodificar 12 MP adentro del canvas.
   En el navegador (PWA) el plugin no existe: sigue el <input type=file>
   de siempre, con la tubería de shrinkImg como red.
============================================================ */
const camPlug=()=>{ try{ return NATIVO?plug('Camera'):null; }catch(e){ return null; } };
const CAM_CANCEL=/cancel|denied|no image|not picked|no photo/i;

async function pedirFotoNativa(max){
  const C=camPlug();
  if(!C) return null;
  /* se pide un poco más grande que el destino final: el ajuste fino y el
     tope de peso los sigue haciendo shrinkImg, que ya sabe cómo dejarlo */
  const lado=Math.min(Math.round((max||900)*1.3),2600);
  const f=await C.getPhoto({
    resultType:'base64',           /* base64 = ya convertido a JPEG por Android */
    source:'PROMPT',               /* «Sacar una foto» o «Elegir de la galería» */
    quality:88,
    width:lado, height:lado,       /* entra en un cuadrado de ese lado, sin deformar */
    correctOrientation:true,
    saveToGallery:false,
    allowEditing:false,
    promptLabelHeader:'Foto',
    promptLabelCancel:'Cancelar',
    promptLabelPhoto:'Elegir de la galería',
    promptLabelPicture:'Sacar una foto',
  });
  const b64=f&&f.base64String;
  if(!b64) throw new Error('El celular no devolvió ninguna foto');
  const fmt=String(f.format||'jpeg').toLowerCase();
  return `data:image/${fmt==='png'?'png':'jpeg'};base64,${b64}`;
}
/* varias de una (galería). Devuelve Blobs ya pasados a JPEG por Android. */
async function pedirVariasNativas(limite,max){
  const C=camPlug();
  if(!C||!C.pickImages) return null;
  const lado=Math.min(Math.round((max||800)*1.3),2600);
  const r=await C.pickImages({
    quality:88, width:lado, height:lado, correctOrientation:true, limit:limite||1,
  });
  const fotos=((r&&r.photos)||[]).slice(0,limite||1);
  const out=[];
  for(const f of fotos){
    /* pickImages devuelve un archivo temporal (ya JPEG), no base64 */
    const src=f.webPath||(window.Capacitor&&window.Capacitor.convertFileSrc
      ? window.Capacitor.convertFileSrc(f.path) : f.path);
    out.push(await (await fetch(src)).blob());
  }
  return out;
}
/* dataURL → Blob, para poder pasar la foto nativa por la misma tubería */
function dataURLaBlob(d){
  const [cab,b64]=String(d).split(',');
  const tipo=(cab.match(/data:([^;]+)/)||[,'image/jpeg'])[1];
  const bin=atob(b64||'');
  const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:tipo});
}

function pedirFoto(cb,max,onErr){
  /* ---- camino del APK ---- */
  if(camPlug()){
    pedirFotoNativa(max).then(d=>{
      if(!d) return;
      shrinkImg(dataURLaBlob(d),cb,max||900,onErr);
    }).catch(e=>{
      const m=String(e&&e.message||e||'');
      if(CAM_CANCEL.test(m)) return;          /* tocó «Cancelar»: no es un error */
      /* algo raro con el plugin: en vez de dejarla sin poder cargar la foto,
         cae al selector de archivos de la WebView */
      console.warn('[TEXMA] la cámara nativa falló, voy por el selector web:',e);
      pedirFotoWeb(cb,max,onErr);
    });
    return;
  }
  pedirFotoWeb(cb,max,onErr);
}

function pedirFotoWeb(cb,max,onErr){
  const i=document.createElement('input');
  i.type='file';
  /* con `image/*` a secas hay galerías de Android que ni ofrecen los HEIC:
     nombrarlos hace que aparezcan y que podamos dar un error claro */
  i.accept='image/*,.heic,.heif,.webp';
  i.style.display='none';
  document.body.appendChild(i);
  const limpiar=()=>{ try{ i.remove(); }catch(e){} };
  i.addEventListener('change',()=>{
    const f=i.files&&i.files[0];
    limpiar();                       /* el File sigue vivo aunque saquemos el input */
    if(!f) return;                   /* canceló */
    if(f.size>2*1024*1024) toast('Preparando la foto…');
    shrinkImg(f,cb,max||900,onErr);
  });
  setTimeout(limpiar,120000);   /* si cancela, no queda basura en el DOM */
  i.click();
}
